name: Patch day

# Moves the site to a new live patch on the day Riot's schedule (data/patch-schedule.json) says it ships.
# Every 20 minutes from Tuesday to Friday (plus once a day as a fallback), web/scripts/patch_day.py checks
# whether a scheduled patch is due and already out. Riot doesn't publish the time of day, so it keeps
# polling until it is. Then this run refreshes the art, names, Guide and champion data for it, checks the
# site still builds and passes its tests, and pushes to main, which deploys. Days with nothing due stop
# after the first step.
on:
  schedule:
    - cron: "*/20 * * * 2-5"
    - cron: "37 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-day
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Is a new patch out?
        id: check
        run: python3 web/scripts/patch_day.py
      - name: Refresh art, names and game data for the new patch
        if: steps.check.outputs.status == 'ready'
        run: |
          pip install xxhash pytest
          python3 web/scripts/fetch_assets.py --refresh
          python3 guide/build_data.py --languages
          python3 guide/build_history.py
          python3 champions/build_data.py
          python3 champions/build_i18n.py
      - uses: actions/setup-node@v7
        if: steps.check.outputs.status == 'ready'
        with:
          node-version: 22
      - name: Build and test the site
        if: steps.check.outputs.status == 'ready'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          cd .. && python -m pytest tests/data -q
      - name: Push to main
        if: steps.check.outputs.status == 'ready'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/assets web/public/i18n web/public/embed web/src/data guide champions
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Live patch ${{ steps.check.outputs.version }}"
            git pull --rebase
            git push
          fi
