name: Apple TV app

# Tests the Apple TV data package and builds the app whenever either, or the shared Swift package, changes.
on:
  pull_request:
    paths: ["apps/tvos/**", "apps/shared/**", ".github/workflows/tvos-app.yml"]
  push:
    branches: [main]
    paths: ["apps/tvos/**", "apps/shared/**", ".github/workflows/tvos-app.yml"]

concurrency:
  group: tvos-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Test the Apple TV data package
        working-directory: apps/tvos/DeepARAMTVKit
        run: swift test
      - name: Build the app for Apple TV
        working-directory: apps/tvos
        run: |
          xcodebuild build -project DeepARAMTV.xcodeproj -scheme DeepARAMTV \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO | tail -60
          exit ${PIPESTATUS[0]}
