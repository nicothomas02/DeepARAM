name: Release apps

# Builds the Windows installers and the Linux packages and attaches them to one GitHub release, so every
# download has one home. Start one by pushing a tag (git tag v0.2.0 && git push origin v0.2.0), or
# from the Actions tab with "Run workflow" and a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 0.2.0 (the release is tagged v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - id: has
        shell: bash
        run: echo "app=$([ -f apps/desktop/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.app == 'yes'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - if: steps.has.outputs.app == 'yes'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.has.outputs.app == 'yes'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build installers
        if: steps.has.outputs.app == 'yes'
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          # The release's version goes into the app, so automatic updates can tell it's current.
          npx tauri build --config "{\"version\":\"${VERSION#v}\"}"
      # A fixed name as well, so deeparam.com/download/windows always finds the newest one.
      - name: Name it for the download page
        if: steps.has.outputs.app == 'yes'
        shell: bash
        run: |
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe DeepARAM-Windows-Setup.exe
          # The app checks an automatic update against this before running it.
          sha256sum DeepARAM-Windows-Setup.exe > DeepARAM-Windows-Setup.exe.sha256
      - if: steps.has.outputs.app == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            DeepARAM-Windows-Setup.exe
            DeepARAM-Windows-Setup.exe.sha256
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install WebKitGTK and the tray library
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build AppImage, .deb and .rpm
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --config "{\"version\":\"${VERSION#v}\"}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: files
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${VERSION#v}"; tag="v$v"
          # Artifacts keep their folders (bundle/nsis, appimage, deb...), so collect the files themselves.
          mapfile -t assets < <(find files -type f | sort)
          printf '%s\n' "${assets[@]}"
          notes="DeepARAM apps $v.

          - **Windows** (DeepARAM-Windows-Setup.exe, or .msi): Windows may say \"Windows protected your PC\" the first time. Choose More info, then Run anyway.
          - **Linux** (.AppImage, .deb or .rpm, x86_64): the AppImage runs on most distributions after chmod +x; the .deb is for Debian and Ubuntu, the .rpm for Fedora and openSUSE."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "DeepARAM $v" --notes "$notes" --target "$GITHUB_SHA"
          fi
