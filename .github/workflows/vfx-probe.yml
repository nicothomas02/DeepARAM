name: VFX probe
on:
  push:
    branches: [claude/project-thread-u8fuuk]
    paths: [.github/workflows/vfx-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          M=channels/public/releases/ECB664EAD9A8FE20.manifest
          for h in lol.secure.dyn.riotcdn.net lol.dyn.riotcdn.net; do
            for ua in "RiotClient/97.0.0.1234 rso-auth (Windows;10;;Professional, x64)" "LeagueOfLegendsPatcher" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" "python-requests/2.31.0"; do
              echo "$h | $ua | $(curl -sS -A "$ua" -o /dev/null -w '%{http_code} %{size_download}' https://$h/$M)"
            done
          done
          curl -sS -o /dev/null -w "ddragon %{http_code}\n" https://ddragon.leagueoflegends.com/api/versions.json
          curl -sS "https://clientconfig.rpg.riotgames.com/api/v1/config/public?namespace=keystone.products.league_of_legends.patchlines" | head -c 600; echo
