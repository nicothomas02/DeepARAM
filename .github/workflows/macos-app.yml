name: Mac app

# Builds the Mac app whenever it or the shared Swift package changes.
on:
  pull_request:
    paths: ["apps/macos/**", "apps/shared/**", ".github/workflows/macos-app.yml"]
  push:
    branches: [main]
    paths: ["apps/macos/**", "apps/shared/**", ".github/workflows/macos-app.yml"]

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Test the shared package and build DeepARAM.app
        run: UNIVERSAL=1 apps/macos/scripts/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: DeepARAM-mac
          path: apps/macos/build/DeepARAM.app
          retention-days: 14
