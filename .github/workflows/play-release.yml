name: Google Play release

# Builds the signed app bundle for the Android app (apps/android: phones, tablets and Chromebooks,
# com.deeparam.app). Run it from the Actions tab with "Run workflow". The bundle is kept on the run for
# upload in Play Console. With the PLAY_SERVICE_ACCOUNT_JSON secret set and a track picked, it also goes
# to that track as a draft release.
# Drafts aren't live: someone still presses "Start rollout" in Play Console.
#
# Secrets: ANDROID_UPLOAD_KEYSTORE (the upload .jks, base64), ANDROID_UPLOAD_KEYSTORE_PASSWORD,
# ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD, and optionally PLAY_SERVICE_ACCOUNT_JSON.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version people see, like 1.0.0"
        required: true
      track:
        description: "Play track to send a draft release to (needs PLAY_SERVICE_ACCOUNT_JSON); none only builds"
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  bundles:
    name: Signed bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The version code is the run number, so every release is higher than the last.
      RELEASE: ${{ github.run_number }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Add the ANDROID_UPLOAD_* secrets first (apps/android/README.md, Releasing)."; exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          mkdir -p ~/.gradle
          {
            echo "deeparam.keystore=$RUNNER_TEMP/upload.jks"
            echo "deeparam.keystorePassword=$STORE_PASSWORD"
            echo "deeparam.keyAlias=$KEY_ALIAS"
            echo "deeparam.keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
            echo "deeparam.versionCode=$RELEASE"
            echo "deeparam.versionName=$VERSION"
          } >> ~/.gradle/gradle.properties
      - name: Build the bundle
        working-directory: apps/android
        run: ./gradlew :core:testDebugUnitTest :app:bundleRelease --console=plain
      - name: Check it is signed
        run: |
          mkdir -p bundles
          cp apps/android/app/build/outputs/bundle/release/app-release.aab "bundles/deeparam-$VERSION.aab"
          jarsigner -verify "bundles/deeparam-$VERSION.aab" > /dev/null || { echo "::error::the bundle is not signed"; exit 1; }
          ls -l bundles
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundles-${{ inputs.version }}
          path: bundles/
      - name: Mapping files for Play's crash reports
        uses: actions/upload-artifact@v4
        with:
          name: play-mapping-${{ inputs.version }}
          path: apps/android/app/build/outputs/mapping/release/mapping.txt
      - name: Draft release on Google Play
        if: inputs.track != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.deeparam.app
          releaseFiles: bundles/deeparam-${{ inputs.version }}.aab
          releaseName: ${{ inputs.version }}
          track: ${{ inputs.track }}
          status: draft
          mappingFile: apps/android/app/build/outputs/mapping/release/mapping.txt
