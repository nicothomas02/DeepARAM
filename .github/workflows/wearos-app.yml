name: Wear OS app

# Tests and builds the Wear OS app whenever it changes.
on:
  pull_request:
    paths: ["apps/wearos/**", "apps/android/core/**", ".github/workflows/wearos-app.yml"]
  push:
    branches: [main]
    paths: ["apps/wearos/**", "apps/android/core/**", ".github/workflows/wearos-app.yml"]

concurrency:
  group: wearos-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug build and lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: deeparam-wearos-debug
          path: apps/wearos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
