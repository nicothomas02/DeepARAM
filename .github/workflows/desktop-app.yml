name: Desktop app

# Builds the Tauri desktop app (apps/desktop): Windows installers and Linux packages, whenever it changes.
# Downloads are published only by release.yml, so nothing here puts a build in front of people.
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/desktop-app.yml"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Lint and test
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build installers
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: DeepARAM-Windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux packages
    # The oldest supported Ubuntu, so the AppImage runs on every distribution with glibc 2.35 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install WebKitGTK and the tray library
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Lint and test
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build AppImage, .deb and .rpm
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: DeepARAM-Linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14

  flatpak:
    name: Flatpak
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      # The image ships the GNOME SDK in one of its layers, and it is rebuilt only twice a week. When
      # Flathub has a newer SDK, flatpak-builder updates it in place, which renames directories of that
      # layer. Some hosted runners refuse that ("Invalid cross-device link") and the build stops there.
      # On a volume the SDK sits on a normal filesystem (Docker fills the volume from the image), so the
      # update works on every runner.
      volumes:
        - /var/lib/flatpak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeepARAM-Linux
          path: linux
      - name: Gather the .deb and the tray library recipe
        run: |
          cp linux/deb/*.deb apps/desktop/flatpak/deeparam.deb
          git clone --depth 1 https://github.com/flathub/shared-modules.git apps/desktop/flatpak/shared-modules
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: DeepARAM.flatpak
          manifest-path: apps/desktop/flatpak/com.deeparam.DeepARAM.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: DeepARAM-Flatpak
          path: DeepARAM.flatpak
          if-no-files-found: error
          retention-days: 14

  # TEMPORARY, removed before review: the failure depends on which hosted runner the job lands on, so this
  # samples a few runners. Each sample says whether its runner can rename an image-layer directory, then
  # updates the SDK on the volume the way flatpak-builder does.
  flatpak-volume-samples:
    name: Flatpak volume sample ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      volumes:
        - /var/lib/flatpak
    steps:
      - name: Probe the container filesystem
        run: |
          echo "kernel: $(uname -r)"
          grep -E ' (/|/var/lib/flatpak) ' /proc/mounts | sed -E 's/(lowerdir|upperdir|workdir)=[^, ]*/\1=.../g' | cut -c1-400
          for p in redirect_dir index metacopy xino_auto; do
            printf 'overlay %s=%s\n' "$p" "$(cat /sys/module/overlay/parameters/$p 2>/dev/null || echo unknown)"
          done
          df -h / /var/lib/flatpak | cut -c1-120
          echo "SDK on the volume: $(du -sh /var/lib/flatpak 2>/dev/null | cut -f1), repo objects with more than one link: $(find /var/lib/flatpak/repo/objects -type f -links +1 2>/dev/null | head -2000 | wc -l) of the first 2000"
          for d in /srv /mnt /media /opt /usr/share/licenses; do [ -d "$d" ] && break; done
          if command -v python3 >/dev/null 2>&1; then
            python3 -c 'import os, sys
          d = sys.argv[1]
          try:
              os.rename(d, d + ".probe")
              os.rename(d + ".probe", d)
              print("PROBE rename of image-layer directory " + d + ": OK")
          except OSError as e:
              print("PROBE rename of image-layer directory " + d + ": FAILED, " + str(e.strerror) + " (errno " + str(e.errno) + ")")' "$d"
          else
            echo "PROBE skipped: no python3 in the image"
          fi
      - name: Update the SDK the way flatpak-builder does
        run: |
          flatpak update -y --noninteractive org.gnome.Sdk//51 org.gnome.Platform//51
          echo "SDK UPDATE ON THE VOLUME: OK"
