name: Desktop app

# Builds the Tauri desktop app (apps/desktop) and its Windows installers whenever it changes.
# Downloads are published only by release.yml, so nothing here puts a build in front of people.
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", ".github/workflows/desktop-app.yml"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Lint and test
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build installers
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: DeepARAM-Windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
