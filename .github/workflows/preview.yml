name: Preview

# A test link for every pull request: builds the site and uploads it as a preview version of the
# Worker (it doesn't touch the live site), then comments the link on the PR. This replaces the
# Cloudflare dashboard's own preview builds, which failed instantly.
# Needs the repo secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit). Without it the job skips.
# Previews use the live databases, so a test submission there is a real one.
on:
  pull_request:
    paths: ["web/**", "simulator/viewer/**", "dashboard/**", "data/**", "guide/**", "champions/**", "tools/fun/**", ".github/workflows/preview.yml"]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview link
    # Pull requests from forks can't read the token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5d91be637d1a1dde747c985811fbeb88
    steps:
      - name: Check for the token
        id: token
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ok=yes" >> "$GITHUB_OUTPUT"
          else echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so no preview link."; fi
      - if: steps.token.outputs.ok == 'yes'
        uses: actions/checkout@v7
      - if: steps.token.outputs.ok == 'yes'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.token.outputs.ok == 'yes'
        run: npm ci --no-audit --no-fund
      - name: Build
        if: steps.token.outputs.ok == 'yes'
        run: npx opennextjs-cloudflare build
      - name: Upload a preview version
        id: upload
        if: steps.token.outputs.ok == 'yes'
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}" 2>&1 | tee upload.log
          url=$(grep -o 'https://pr-[^ ]*workers\.dev' upload.log | head -1)
          [ -n "$url" ] || url=$(grep -o 'https://[^ ]*workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the link
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = "<!-- preview-link -->";
            const body = `${marker}\nPreview of this pull request: ${process.env.URL}\n\nUpdated for ${context.sha.slice(0, 7)}.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
