name: Temporary spells and game counts

# TEMPORARY (data/fill/README.md). Does nothing while data/fill/config.json is switched off.
on:
  schedule:
    - cron: "30 6 * * *"   # once a day, after the main stats refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fill
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch spells and game counts
        run: python3 data/fill/fetch_fill.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fill
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update spells and game counts ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
