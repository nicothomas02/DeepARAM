name: Estimated spells and game counts

# data/fill/README.md. Does nothing while data/fill/config.json is switched off.
# Runs right after each "Mayhem stats" refresh (cn-stats.yml), so estimates follow 101.qq.com's
# daily update. That workflow checks hourly, so runs with no new Tencent data are skipped.
on:
  workflow_run:
    workflows: ["Mayhem stats"]
    types: [completed]
  schedule:
    - cron: "30 6 * * *"   # daily fallback
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fill
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip when the Mayhem stats run brought no new data
        id: fresh
        run: |
          cn=$(git log -1 --format=%ct -- data/cn)
          ours=$(git log -1 --format=%ct -- data/fill data/estimates)
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${cn:-0}" -le "${ours:-0}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No new Mayhem stats since the last estimates"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.fresh.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Estimate spells and game counts
        if: steps.fresh.outputs.run == 'true'
        run: python3 data/fill/build_estimates.py
      - name: Early-window builds (blend in the previous window while builds have few games; needs the git history)
        if: steps.fresh.outputs.run == 'true'
        run: python3 data/estimates/early_builds.py || echo "::warning::Early-window builds not refreshed"
      - name: Estimate other stats (augments per champion, items, profiles, odds)
        if: steps.fresh.outputs.run == 'true'
        run: python3 data/estimates/build.py
      - name: Weapon of Destiny tier list (follows who takes the augment)
        if: steps.fresh.outputs.run == 'true'
        # Downloads the augment and item data from CommunityDragon; keep yesterday's ranking if that fails.
        run: python3 data/estimates/weapon_of_destiny.py || echo "::warning::Weapon of Destiny ranking not refreshed"
      - name: Simulated early/mid/late power curve
        if: steps.fresh.outputs.run == 'true'
        run: |
          make -C simulator mayhem_sim
          python3 data/estimates/power_curve.py
          python3 data/estimates/boots_timing.py || echo "::warning::Boots timing not refreshed"
      - name: Traps and Bug finder (The Kitchen)
        if: steps.fresh.outputs.run == 'true'
        run: python3 data/checks/findings.py || echo "::warning::Traps and Bug finder not refreshed"
      - name: Synergies (expected values and checks for every choice; Simulator built above; needs the full git history)
        if: steps.fresh.outputs.run == 'true'
        run: python3 data/estimates/synergies.py || echo "::warning::Synergies not refreshed"
      - name: Keep this patch's item numbers (Tier List set ranges combine them)
        if: steps.fresh.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open("data/estimates/estimates.json"))
          os.makedirs("data/estimates/history", exist_ok=True)
          with open(f"data/estimates/history/{d['patch']}.json", "w") as f:
              json.dump({"patch": d["patch"], "items": d["items"]}, f, separators=(",", ":"))
              f.write("\n")
          PY
      - name: Commit changes
        if: steps.fresh.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fill data/estimates data/checks
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update estimated spells and game counts ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
