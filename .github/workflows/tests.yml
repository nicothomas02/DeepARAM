name: Tests

# Runs on every pull request and on main. Threads merge their own PRs only once these pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The build writes generated files (embeds) that the type check and tests read.
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Page checks at desktop and phone sizes
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: page-check-traces
          path: web/test-results/
          retention-days: 7

  simulator:
    name: Simulator
    # Pinned: the snapshot tests compare exact Monte Carlo results, which can move in the last
    # digit when the system math library (log, cos, acos) or CPU differs. The pinned values, the
    # site's replay data and the cloud build machines all come from Ubuntu 24.04. GitHub's Ubuntu
    # 26.04 runners shift five snapshots slightly (a local 26.04 container with the same g++ 15
    # matches, so it is the runner, not the code). Change this only with a full re-pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Engine sanity checks
        run: make -C simulator test
      - name: Pinned results and data checks
        run: python -m pytest tests/simulator -q

  data:
    name: Data and My Stats
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Data builders, shipped pages and My Stats import
        run: python -m pytest tests/data -q
