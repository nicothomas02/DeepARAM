name: Mayhem stats

on:
  schedule:
    # Hourly, off the top of the hour (less queueing). The check job asks Tencent whether the previous Beijing day is
    # out yet and only then runs the refresh, so the site follows each day's stats within about an hour.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      today:
        description: "Include today's numbers so far (show a new patch's first day right away)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cn-stats
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.newest.outputs.new }}
      day: ${{ steps.newest.outputs.day }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: data/cn
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: newest
        run: cd data/cn && python3 newest.py >> "$GITHUB_OUTPUT" && cat "$GITHUB_OUTPUT"

  refresh:
    needs: check
    # A manual run always refreshes; a scheduled one only when the check found a new day.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.new == 'true')
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # Tencent's days are Beijing days, so "yesterday" in the scripts means the newest finished one
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch current snapshot
        run: python3 data/cn/fetch_cn.py ${TODAY:+--date "$(date -u +%Y%m%d)"}
        env:
          TODAY: ${{ inputs.today && '1' || '' }}
      - name: Fetch each champion's builds
        run: python3 data/cn/builds.py
      - name: Append new days and rebuild history
        run: python3 data/cn/history.py ${TODAY:+--today}
        env:
          TODAY: ${{ inputs.today && '1' || '' }}
      - name: Rebuild champion pages with the new builds
        # a game-data download hiccup shouldn't hold back the stats themselves
        continue-on-error: true
        run: python3 champions/build_data.py
      - name: Translate the champion pages' new items and augments
        continue-on-error: true
        run: python3 champions/build_i18n.py
      - name: Host icons for augments and items the new builds use
        continue-on-error: true
        run: |
          python3 web/scripts/fetch_assets.py
          git checkout -- web/public/assets/manifest.json
      - name: Note when the day first appeared
        if: needs.check.outputs.new == 'true'
        run: |
          f=data/cn/history/published.csv
          [ -f "$f" ] || echo "stat_date,first_seen_utc" > "$f"
          echo "${{ needs.check.outputs.day }},$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$f"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cn champions/data.js champions/i18n web/public/assets
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update Mayhem stats ($(date -u +%Y-%m-%d))"
            git push
          fi
