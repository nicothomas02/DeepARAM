name: Mayhem stats

on:
  schedule:
    # Hourly, off the top of the hour (less queueing). The check job asks Tencent whether the previous Beijing day is
    # out yet and only then runs the refresh, so the site follows each day's stats within about an hour.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      today:
        description: "Include today's numbers so far (show a new patch's first day right away)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cn-stats
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.newest.outputs.new }}
      day: ${{ steps.newest.outputs.day }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/cn
            data/aramhex
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: newest
        # A new 101 day, or a new AramHex release (every 2-4 days, data/aramhex/fetch.py), triggers the refresh.
        run: |
          out=$(cd data/cn && python3 newest.py)
          echo "$out"
          ah=$(python3 data/aramhex/fetch.py --is-new || echo "new=false")
          echo "aramhex: $ah"
          if [ "$ah" = "new=true" ]; then echo "$out" | sed 's/^new=.*/new=true/' >> "$GITHUB_OUTPUT"; else echo "$out" >> "$GITHUB_OUTPUT"; fi
          cat "$GITHUB_OUTPUT"

  refresh:
    needs: check
    # A manual run always refreshes; a scheduled one only when the check found a new day.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.check.outputs.new == 'true')
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # Tencent's days are Beijing days, so "yesterday" in the scripts means the newest finished one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current snapshot
        run: python3 data/cn/fetch_cn.py ${TODAY:+--date "$(date -u +%Y%m%d)"}
        env:
          TODAY: ${{ inputs.today && '1' || '' }}
      - name: Fetch each champion's builds
        run: python3 data/cn/builds.py
      - name: Refresh the Simulator's augment pools from the new builds
        continue-on-error: true
        run: |
          python3 simulator/tools/build_augment_pools.py
          python3 simulator/tools/strip_notes.py simulator/viewer/replay-data/pbe simulator/data/pbe/augment_pools.json
      - name: Append new days and rebuild history
        run: python3 data/cn/history.py ${TODAY:+--today}
        env:
          TODAY: ${{ inputs.today && '1' || '' }}
      - name: Save the live patch's duo synergies (for the Duos tab's hold check)
        run: python3 data/cn/partner_history.py
      - name: Re-test the Duos tab's "why it works" rules on the newest patch (faded rules are skipped)
        continue-on-error: true
        run: python3 data/cn/duo_why_check.py
      - name: Estimate how many games the stats come from (confidence intervals)
        continue-on-error: true
        run: python3 data/stats/games.py
      - name: Download the AramHex dataset (real game counts; keep the last copy if it fails)
        run: python3 data/aramhex/fetch.py || echo "::warning::AramHex not refreshed"
      - name: Lay AramHex's real numbers over the 101 files (101 keeps skill orders, starters, six-item builds, teammates)
        run: python3 data/aramhex/merge.py
      - name: Score how each patch's picks held up on the next (Patches page scorecard)
        continue-on-error: true
        run: python3 data/aramhex/scorecard.py
      - name: Re-time boots for the new cores (data/estimates/boots_timing.json is keyed by real cores; a stale file failed tests on main, 2026-11-24)
        run: |
          make -C simulator mayhem_sim
          python3 data/estimates/boots_timing.py || echo "::warning::Boots timing not refreshed"
      - name: Refresh the Simulator's augment pools again with AramHex's augment lists
        continue-on-error: true
        run: |
          python3 simulator/tools/build_augment_pools.py
          python3 simulator/tools/strip_notes.py simulator/viewer/replay-data/pbe simulator/data/pbe/augment_pools.json
      - name: Rebuild champion pages with the new builds
        # a game-data download hiccup shouldn't hold back the stats themselves
        continue-on-error: true
        run: python3 champions/build_data.py
      - name: Translate the champion pages' new items and augments
        continue-on-error: true
        # if a download fails it still drops items and augments the pages no longer have (and exits non-zero)
        run: python3 champions/build_i18n.py
      - name: Refresh the champion pages' English page text
        continue-on-error: true
        run: |
          python3 -m pip install -q xxhash
          python3 guide/i18n_keys.py
      - name: Host icons for augments and items the new builds use
        continue-on-error: true
        run: |
          python3 web/scripts/fetch_assets.py
          git checkout -- web/public/assets/manifest.json
      - name: Note when the day first appeared
        if: needs.check.outputs.new == 'true'
        run: |
          f=data/cn/history/published.csv
          [ -f "$f" ] || echo "stat_date,first_seen_utc" > "$f"
          echo "${{ needs.check.outputs.day }},$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$f"
      - name: Check the new stats with their data tests (nothing is committed when they fail)
        # A bot push starts no Tests run, so without this a bad refresh reaches main unchecked (2026-11-26: augment
        # pick rates above 100%). Only the tests for the stats this job must get right (data/cn, data/stats,
        # data/aramhex, the spell pairs, boots timing): champion pages, translations and icons come from steps
        # that may fail on a download hiccup and must not hold back the stats, and the rest of tests/data
        # (importer, backup, pages) is not this job's. tests/data/test_stats_gate.py keeps this list real, and in
        # the order the whole suite runs them (some test files only load after others).
        run: |
          python3 -m pip install -q pytest
          python3 -m pytest -q tests/data/test_aramhex_pool.py tests/data/test_aramhex_snapshot.py tests/data/test_data_cn.py tests/data/test_data_estimates.py::test_boots_timing tests/data/test_data_fill.py tests/data/test_data_stats.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cn data/stats data/aramhex data/fill/spells_games.json data/estimates/boots_timing.json champions/data.js champions/i18n web/public/assets simulator/data/augment_pools.json simulator/data/pbe/augment_pools.json simulator/viewer/replay-data/pbe/augment_pools.json
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update Mayhem stats ($(date -u +%Y-%m-%d))"
            git push
          fi
