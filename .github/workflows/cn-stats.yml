name: Mayhem stats

on:
  schedule:
    - cron: "0 6 * * *"   # 14:00 Beijing, after Tencent publishes the previous day
  workflow_dispatch:
    inputs:
      today:
        description: "Include today's numbers so far (show a new patch's first day right away)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cn-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current snapshot
        run: python3 data/cn/fetch_cn.py ${TODAY:+--date "$(date -u +%Y%m%d)"}
        env:
          TODAY: ${{ inputs.today && '1' || '' }}
      - name: Fetch each champion's builds
        run: python3 data/cn/builds.py
      - name: Append new days and rebuild history
        run: python3 data/cn/history.py ${TODAY:+--today}
        env:
          TODAY: ${{ inputs.today && '1' || '' }}
      - name: Rebuild champion pages with the new builds
        # a game-data download hiccup shouldn't hold back the stats themselves
        continue-on-error: true
        run: python3 champions/build_data.py
      - name: Translate the champion pages' new items and augments
        continue-on-error: true
        run: python3 champions/build_i18n.py
      - name: Host icons for augments and items the new builds use
        continue-on-error: true
        run: |
          python3 web/scripts/fetch_assets.py
          git checkout -- web/public/assets/manifest.json
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cn champions/data.js champions/i18n web/public/assets
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update Mayhem stats ($(date -u +%Y-%m-%d))"
            git push
          fi
