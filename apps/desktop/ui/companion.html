<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepARAM</title>
<style>
  /* The companion window (src-tauri/src/companion.rs): a normal window for a second screen, in the site's dark look. */
  /* Mona Sans, the site's typeface, shipped with the app. */
  @font-face { font-family: "Mona Sans"; font-style: normal; font-weight: 200 900; font-display: swap; src: url(fonts/mona-sans-latin.woff2) format("woff2"); }
  :root { color-scheme: dark; --prismatic: linear-gradient(100deg, #9fe7ff, #c9b8ff 40%, #ffb8e0 70%, #ffe2a3); --silver: #a3adbb;
    --depth: inset 0 1px 0 rgb(255 255 255 / .06), 0 1px 2px rgb(0 0 0 / .4), 0 4px 12px rgb(0 0 0 / .35); --bg: #090b0f; --surface: #11151c; --raised: #181d26; --fg: #e8ecf2; --muted: #8b94a3;
    --line: #222936; --accent: #5cc0ff; --good: #4cc98b; --bad: #f0776f; --gold: #e0b45c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.4 "Mona Sans", "Segoe UI Variable", "Segoe UI", Cantarell, "Noto Sans", system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; }
  .row { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; }
  .row.best { border-color: var(--accent); }
  .row img, .mates img { width: 36px; height: 36px; border-radius: 8px; background: var(--raised); }
  .name { font-weight: 600; }
  .why { color: var(--muted); font-size: 12px; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
  .mates { display: flex; gap: 6px; }
  .mates img { width: 28px; height: 28px; }
  .big { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .bar { height: 14px; border-radius: 7px; background: var(--raised); overflow: hidden; margin: 12px 0; }
  .bar span { display: block; height: 100%; }
  .box { padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-top: 10px; }
  .box.yes { border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  svg { width: 100%; height: 140px; display: block; margin-top: 8px; }
  button.row { width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  button.row:hover { border-color: var(--muted); }
  h2.now { color: var(--accent); }
  input[type=search] { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; margin-bottom: 8px; }
  .taken { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .chip { display: flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
    background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 3px; }
  .chip img { width: 22px; height: 22px; border-radius: 50%; }
  .items { display: grid; gap: 8px; }
  .item { display: flex; gap: 10px; align-items: center; }
  .item img { width: 32px; height: 32px; border-radius: 6px; }
  .box.now { border-color: var(--gold); }
  .why.lbl { margin: 10px 0 6px; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; font-weight: 600; }
  .why.lbl:first-child, .box > .why:first-child + .why.lbl { margin-top: 0; }
  .core { display: flex; gap: 6px; flex-wrap: wrap; }
  .core img { width: 40px; height: 40px; border-radius: 8px; }
  .core img.own, .item.own { opacity: .35; }
  .core img.nx, .item.nx img { box-shadow: 0 0 0 2px var(--gold); }
  .items.lst { gap: 6px; }
  .items.lst .item img { width: 28px; height: 28px; }
  .item.lit .why { color: var(--gold); }
  .path { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; }
  .path .gap { width: 8px; }
  .slot { display: grid; justify-items: center; gap: 3px; font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .slot img { width: 40px; height: 40px; border-radius: 8px; }
  .slot.own { opacity: .35; }
  .slot.nx img { box-shadow: 0 0 0 2px var(--gold); }
  .slot.nx span { color: var(--gold); }
  .slot.sw img { outline: 2px dashed var(--gold); outline-offset: 1px; }
  .tip.lit { color: var(--gold); }
  @media (min-width: 1000px) { .slot img { width: 52px; height: 52px; } .slot { font-size: 11px; } }
  .offer .reroll { margin: 8px 2px 2px; }
  .why.lbl b { text-transform: none; letter-spacing: 0; }
  .items.lst .why.lbl { margin: 4px 0 -2px; }
  .tip { margin-top: 8px; }
  .plan { display: flex; justify-content: space-between; align-items: center; }
  .plan .keys b { color: var(--accent); }
  .filters { display: flex; gap: 6px; margin-bottom: 8px; }
  .chip.f, .chip.br { padding: 3px 10px; }
  .chip.on { color: var(--fg); border-color: var(--accent); }
  .aug { padding: 6px 10px; margin-bottom: 4px; }
  .aug img { width: 30px; height: 30px; }
  .tip b { color: var(--fg); }
  .offer { border: 1px solid var(--accent); border-radius: 14px; padding: 8px; margin-bottom: 10px; }
  .offer .why.src { margin: 2px 4px 6px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .quick .keys { display: flex; gap: 4px; align-items: center; }
  .quick .key { min-width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; background: var(--raised); font-weight: 600; font-size: 12px; }
  .quick .spell { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .quick img { width: 24px; height: 24px; border-radius: 6px; }
  /* Full screen on a second monitor: three columns, bigger type so it reads at a glance. */
  @media (min-width: 1000px) {
    body { font-size: 16px; padding: 28px 36px; }
    main { max-width: 1500px; margin: 0 auto; }
    .cols { display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px; align-items: start; }
    .cols > section > h2:first-child { margin-top: 0; }
    .aug img, .row img { width: 40px; height: 40px; }
    .row { grid-template-columns: 40px 1fr auto; }
    .why, .num, .note { font-size: 14px; }
  }
  /* The site's look: a champion splash banner, cards with depth, rarity rings, the prismatic flourish. */
  .row, .box { box-shadow: var(--depth); }
  .hero { position: relative; display: flex; align-items: flex-end; gap: 14px; min-height: 132px; padding: 16px 18px; margin: -4px 0 14px;
    border-radius: 18px; border: 1px solid var(--line); overflow: hidden; background: var(--surface); box-shadow: var(--depth); }
  .hero > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; border: 0; border-radius: 0; }
  .hero::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgb(9 11 15 / .92) 15%, rgb(9 11 15 / .55) 55%, rgb(9 11 15 / .15)), linear-gradient(0deg, rgb(9 11 15 / .7), transparent 60%); }
  .hero > :not(.bg) { position: relative; z-index: 2; }
  .hero > img { width: 56px; height: 56px; border-radius: 14px; border: 2px solid rgb(255 255 255 / .15); }
  .hero .title { font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
  .hero .sub { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
  .hero .sub.now { color: var(--accent); }
  .live-mini { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .live-mini .bar { flex: 1; height: 6px; margin: 0; }
  /* At-a-glance visuals: physical/magic split bar, enemy strip in the banner, strength bars, icon tiles. */
  .split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--raised); margin: 6px 0 4px; }
  .split .ad { background: #e8845a; } .split .ap { background: #7f8cff; }
  .split-key { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .split-key b { color: var(--fg); }
  .foes { margin-left: auto; min-width: 170px; max-width: 220px; align-self: flex-end; }
  .foes .mates img { width: 26px; height: 26px; border-radius: 7px; }
  .foes .why.lbl { margin: 0 0 4px; }
  .sbar { height: 4px; border-radius: 2px; background: var(--raised); margin-top: 5px; overflow: hidden; max-width: 160px; }
  .sbar span { display: block; height: 100%; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; margin-top: 6px; }
  .tile { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 11px; line-height: 1.2; }
  .tile img { width: 40px; height: 40px; border-radius: 8px; }
  .tile.aug img { border-radius: 50%; }
  .ii { width: 18px; height: 18px; border-radius: 4px; vertical-align: -4px; margin-right: 3px; }
  .ii.round { border-radius: 50%; }
  .key.inl { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 6px; background: var(--raised); color: var(--accent); font-weight: 700; font-size: 12px; margin-left: 2px; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .hero .fs { position: absolute; top: 10px; right: 10px; z-index: 2; font: inherit; font-size: 11px; font-weight: 600; color: var(--text, #fff);
    background: rgb(9 11 15 / .6); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
  .ink { background: var(--prismatic); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .offer { border: 1px solid transparent; background: linear-gradient(var(--bg), var(--bg)) padding-box, var(--prismatic) border-box; }
  .offer.ask { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(90deg, var(--gold), var(--gold)) border-box; }
  .aug[data-r="prismatic"] img { box-shadow: 0 0 0 2px #c9b8ff; }
  .aug[data-r="gold"] img { box-shadow: 0 0 0 2px var(--gold); }
  .aug[data-r="silver"] img { box-shadow: 0 0 0 2px var(--silver); }
  .aug img { border-radius: 50%; }
  body.idle { background: var(--bg) url(art/howling-abyss.webp) center / cover no-repeat; min-height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; }
  .brand b { font-size: 20px; letter-spacing: -.01em; }
  @media (min-width: 1000px) { .hero { min-height: 220px; padding: 24px 28px; } .hero .title { font-size: 34px; } .hero > img { width: 72px; height: 72px; } }
  [hidden] { display: none !important; }
</style>
</head>
<body class="idle">
<main id="view"><div class="brand"><img src="icon.png" alt=""><b>DeepARAM</b></div><p class="note">Opens by itself in Mayhem champion select, follows the game on your second monitor, and shows a review after it.</p></main>
<script src="engine.js"></script>
<script>
  // The app calls showPick({allies, mine, bench}) in champion select (champion ids), showGame({t, champ, level, dead,
  // items, enemies, offer}) during a game (offer: the augments on offer, read off the screen), showOffer(ids) the
  // moment the offer changes, and showReview({points, turns, ffFrom, result}) after it. In game the build is the focus;
  // the owner's chance to win and surrender call sit small under it, and the chart over the game waits for the review.
  const SITE = "https://deeparam.com";
  const view = document.getElementById("view");
  const pct = (p) => `${Math.round(p * 100)}%`;
  const pts = (n) => (Math.abs(n) < 0.0005 ? "0.0" : `${n > 0 ? "+" : "−"}${Math.abs(n * 100).toFixed(1)}`);
  const clock = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
  const color = (p) => (p >= 0.6 ? "var(--good)" : p >= 0.4 ? "var(--gold)" : "var(--bad)");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const icon = (alias) => `<img src="${SITE}/icons/champions/${encodeURIComponent(alias)}.webp" alt="">`;
  const label = (alias) => alias.replace(/([a-z])([A-Z])/g, "$1 $2");
  // The champion's splash, as on the site's champion page (Data Dragon spells Fiddlesticks with one capital).
  const splash = (alias) => `${SITE}/assets/dd/img/champion/splash/${encodeURIComponent(alias === "FiddleSticks" ? "Fiddlesticks" : alias)}_0.jpg`;
  const hero = (alias, title, sub, subId = "") => `<div class="hero">${alias ? `<img class="bg" src="${splash(alias)}" alt="" data-drop>` : ""}
      ${alias ? icon(alias) : `<img src="icon.png" alt="">`}<div><div class="title">${title}</div><div class="sub"${subId ? ` id="${subId}"` : ""}>${sub}</div></div>
      ${window.__TAURI_INTERNALS__ ? `<button class="fs">${isFull ? "Exit full screen" : "Full screen"}</button>` : ""}</div>`;
  // Full screen from the button, F11 or Esc; the app answers with the state it ended in, which labels the button.
  let isFull = false;
  window.fullScreen = (on) => window.__TAURI_INTERNALS__?.invoke("companion_fullscreen", { on: on ?? null })
    .then((full) => { isFull = full; document.querySelectorAll(".hero .fs").forEach((b) => (b.textContent = full ? "Exit full screen" : "Full screen")); })
    .catch((e) => console.error("fullscreen", e));
  // The app went full screen by itself (second monitor): relabel the button.
  window.setFull = (full) => { isFull = full; document.querySelectorAll(".hero .fs").forEach((b) => (b.textContent = full ? "Exit full screen" : "Full screen")); };
  let lastChamp = null;
  // The game's last update, kept for the review's recap (your augments, your items, the enemy damage).
  let lastGame = null;
  const setView = (html) => { document.body.classList.remove("idle"); view.innerHTML = html; };

  // Same scoring as the site's Best pick (web/src/lib/team-fit-score.ts): ranked on strength; fit is context only.
  let fit = null;
  const loadFit = () => fit ?? (fit = fetch(`${SITE}/data/team-fit.json`).then((r) => r.json()).catch(() => null));
  function pairBoost(d, a, b) {
    const exact = d.pairs[[a, b].sort().join(" ")];
    if (exact !== undefined) return exact;
    let sum = 0, n = 0;
    for (const x of d.champions[a]?.[1] ?? []) for (const y of d.champions[b]?.[1] ?? []) {
      const v = d.archetypes[[x, y].sort().join("+")];
      if (v !== undefined) { sum += v; n += 1; }
    }
    return n ? sum / n : 0;
  }
  // Champion strength by skill bracket, like the site's Tier List picker (Nico 2026-11-23): All players by default,
  // Casual / Mid / Top 5% on a toggle, remembered on this computer.
  const BRACKETS = [["all", "All players"], ["casual", "Casual"], ["mid", "Mid"], ["high", "Top 5%"]];
  let bracket = (() => { try { return localStorage.getItem("bracket") || "all"; } catch { return "all"; } })();
  const strengthOf = (d, id) => (bracket !== "all" ? d.brackets?.[bracket]?.[id] : undefined) ?? d.champions[id][0];
  let lastPick = null;
  // "Your record" (Nico 2026-11-24, everyone with a published profile, only their own games): the player's record on
  // each choice, pulled toward 50% by 10 games, nudges its strength. Same formula as the PC app: 0.36 x (shrunk record
  // - 0.5) win-rate points, from 3 games on. Fitted on one player's 1,017 games (t = 2.0), so it stays small.
  const REC_COEF = 0.36, REC_MIN = 3;
  let myRec = null, myRecAt = 0;
  const loadRecord = async () => {
    if (myRec && Date.now() - myRecAt < 10 * 60e3) return myRec;
    const inv = window.__TAURI_INTERNALS__?.invoke;
    const r = inv ? await inv("my_record").catch(() => null) : null;
    myRec = new Map((r?.champions ?? []).map(([id, n, w]) => [id, { n, w }]));
    myRecAt = Date.now();
    return myRec;
  };
  const recNudge = (r) => (r && r.n >= REC_MIN ? REC_COEF * ((r.w + 5) / (r.n + 10) - 0.5) : 0);
  function rank(d, allies, options) {
    const team = allies.filter((a) => d.champions[a]);
    const others = Object.keys(d.champions).filter((id) => !team.includes(id));
    const avg = new Map(team.map((a) => [a, others.reduce((s, id) => s + pairBoost(d, id, a), 0) / (others.length || 1)]));
    return options.filter((id) => d.champions[id]).map((id) => {
      const parts = team.map((ally) => ({ ally, boost: pairBoost(d, id, ally) - avg.get(ally) }));
      const fitSum = parts.reduce((s, p) => s + p.boost, 0);
      const rec = myRec?.get(d.ids?.[id]);
      const nudge = recNudge(rec);
      const strength = strengthOf(d, id) - 0.5 + nudge;
      return { id, strength, base: strength - nudge, fit: fitSum, score: strength, parts, rec: nudge ? { ...rec, nudge } : null };
    }).sort((a, b) => b.score - a.score);
  }


  // Set before the game, never during it (no taps in game, Nico 2026-11-24): Feeling lucky, and the patch switch
  // where pooling earlier patches changes this champion's augment ranking.
  function gameSettings(ap, me) {
    const ck = me ? keyIn(ap?.champions, me) : undefined;
    const pv = ap?.patch ?? "This patch";
    const patch = ck && ap?.only?.[ck] ? [[false, `${pv}+`], [true, `${pv} only`]].map(([o, l]) => `<button class="chip br pt${o === onlyPatch ? " on" : ""}" data-o="${o ? 1 : 0}" title="${o ? "Ranks augments on this patch's games alone" : "Includes similar recent patches, weighted toward this one"}">${esc(l)}</button>`).join("") : "";
    return `<h2>For this game</h2><div class="filters"><button class="chip lucky${lucky ? " on" : ""}" title="Ranks augments that can complete a combo much higher, and leans toward less-played augments and builds when they are about as strong">I'm feeling lucky</button>${patch}</div>`;
  }

  window.showPick = async ({ allies, mine, bench }) => {
    lastGame = null;
    lastPick = { allies, mine, bench };
    const d = await loadFit();
    if (!d?.brackets?.[bracket]) bracket = "all";
    if (!d) { setView(`${hero(null, "Champion select", "Couldn't load the picks")}<p class="note">Check your connection.</p>`); return; }
    const byId = Object.fromEntries(Object.entries(d.ids ?? {}).map(([a, id]) => [id, a]));
    const team = allies.map((id) => byId[id]).filter(Boolean);
    const options = [mine, ...bench].map((id) => byId[id]).filter(Boolean);
    await loadRecord();
    const ranked = rank(d, team, [...new Set(options)]);
    const rows = ranked.map((p, i) => `
      <div class="row${i === 0 && p.id !== byId[mine] ? " best" : ""}">
        ${icon(p.id)}
        <div><div class="name">${esc(label(p.id))}${p.id === byId[mine] ? " <span class=\"why\">(yours)</span>" : ""}</div><div class="why">${[p.base >= 0.01 ? "Strong this patch" : "", p.rec ? `Your record ${p.rec.w}-${p.rec.n - p.rec.w} (${pts(p.rec.nudge)})` : ""].filter(Boolean).join(" · ")}</div><div class="sbar"><span data-style="width:${Math.max(4, Math.min(100, 50 + p.strength * 1000))}%;background:${p.strength >= 0.01 ? "var(--good)" : p.strength <= -0.01 ? "var(--bad)" : "var(--gold)"}"></span></div></div>
        <div class="num">Strength ${pts(p.strength)}</div>
      </div>`).join("");
    const [builds, k, ap] = await Promise.all([loadBuilds(), loadKinds(), loadPicks()]);
    // Game plan for the champion you're on: skill order and first three items, one glance before loading in.
    const me = byId[mine];
    const plan = me && builds?.champions?.find((c) => c.id.toLowerCase() === me.toLowerCase());
    const planHtml = plan ? `<h2>Plan for ${esc(label(me))}</h2><div class="box plan">
        <span class="keys"${plan.skillSplit ? ` title="Your pick, estimated"` : ""}>${plan.skillSplit ? `<b>${plan.skillSplit.first}</b> to ${plan.skillSplit.points}, then ` : ""}${(plan.skills ?? []).map((x) => `<b>${x}</b>`).join(" › ")}</span>
        <span class="mates">${plan.items.slice(0, 3).map((it) => `<img src="${SITE}${it.icon}" alt="" title="${esc(it.name)}">`).join("")}</span></div>` : "";
    // Team gap: one line, only once the whole team is in and only when something is missing.
    let gap = "";
    const all = [...team, ...(me ? [me] : [])];
    if (all.length >= 5) {
      const FRONT = new Set(["Vanguard", "Warden", "Juggernaut"]);
      const front = all.some((a) => (d.champions[a]?.[1] ?? []).some((x) => FRONT.has(x)));
      const lower = new Map(Object.entries(k?.champions ?? {}).map(([a, m]) => [a.toLowerCase(), m]));
      const magic = all.reduce((t, a) => t + (lower.get(a.toLowerCase()) ?? 0.5), 0) / all.length;
      // Only the tested half of the team gap line (2026-11-23): teams over 75% magic won 9.7 ± 7.2 points below
      // expected (178 teams). "No frontline" failed its test and "under 25% magic" had too few teams, so both stay off.
      void front;
      gap = magic > 0.75 ? "Your team deals little physical damage: an AD item helps if your champion can use one." : "";
    }
    setView(`
      ${hero(me, me ? esc(label(me)) : "Champion select", me ? "Champion select" : "Waiting for your champion")}
      ${team.length ? `<h2>Your team</h2><div class="mates">${team.map(icon).join("")}</div>` : ""}
      ${gap ? `<div class="box">${esc(gap)}</div>` : ""}
      <h2>Your choices, best first</h2>
      ${Object.keys(d.brackets ?? {}).length ? `<div class="filters" title="Skill brackets come from a rating built from game results, not official ranks.${d.bracketPatch && d.bracketPatch !== d.patch ? ` This patch's brackets aren't out yet, so they use patch ${esc(d.bracketPatch)}.` : ""}">${BRACKETS.filter(([b]) => b === "all" || d.brackets[b]).map(([b, l]) => `<button class="chip br${b === bracket ? " on" : ""}" data-b="${b}">${l}</button>`).join("")}</div>` : ""}
      ${rows || `<p class="note">Waiting for your champion and bench…</p>`}
      ${planHtml}
      ${gameSettings(ap, me)}
      <p class="note">Strength this patch${bracket !== "all" ? ` for ${esc(BRACKETS.find(([b]) => b === bracket)[1])} players` : ""}, in win-rate points. A guide, not a promise. You make the pick.</p>`);
  };

  function chart(points, from) {
    if (points.length < 2) return "";
    const end = Math.max(points[points.length - 1][0], 60);
    const x = (t) => (t / end) * 500, y = (p) => 130 - p * 120;
    const path = points.map(([t, p], i) => `${i ? "L" : "M"}${x(t).toFixed(1)},${y(p).toFixed(1)}`).join(" ");
    const ff = from != null ? `<line x1="${x(from)}" x2="${x(from)}" y1="10" y2="130" stroke="var(--bad)" stroke-dasharray="3 4"/>` : "";
    return `<svg viewBox="0 0 500 140" role="img" aria-label="Predicted chance to win over the game">
      <line x1="0" x2="500" y1="${y(0.5)}" y2="${y(0.5)}" stroke="var(--line)" stroke-dasharray="4 4"/>${ff}
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>`;
  }

  // In game, for everyone: the augment ranking for your champion (tap what you took, the rest re-rank by synergy with
  // it) and your next item. Rankings only, never win rates (Riot's policy for overlays). The live chance and the
  // surrender line come only for the site owner (game.live).
  const AUGMENT_LEVELS = [1, 7, 11, 15];
  let picks = null, builds = null, kinds = null;
  const loadKinds = () => kinds ?? (kinds = fetch(`${SITE}/data/damage-types.json`).then((r) => r.json()).catch(() => null));
  const loadPicks = () => picks ?? (picks = fetch(`${SITE}/data/augment-picks.json`).then((r) => r.json()).catch(() => null));
  const loadBuilds = () => builds ?? (builds = fetch(`${SITE}/data/overlay.json`).then((r) => r.json()).catch(() => null));
  const augIcon = (id) => `<img src="${SITE}/icons/augments/${id}.webp" alt="">`;
  // "What it does (estimated)": the same rule as the site's lib/mechanisms.ts whatItDoes (|z| >= 3, at least 8% a
  // minute or 0.3 deaths per 10 minutes, largest |z| first, at most 2, no healing line on picks that shield). Hover only.
  let mech = null, mechData = null;
  let whyB = null;
  const loadWhy = () => whyB ?? (whyB = fetch(`${SITE}/data/why-best.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null));
  const loadMech = () => mech ?? (mech = fetch(`${SITE}/data/mechanism-profiles.json`).then((r) => r.json()).then((j) => (mechData = j)).catch(() => null));
  const MECH_LABEL = { damage: "damage to champions", healing: "healing", mitigated: "damage blocked", cc: "crowd control", deaths: "deaths per 10 minutes" };
  const whatItDoes = (kind, id) => {
    const all = mechData?.[kind];
    if (!all) return "";
    const base = kind === "items" && id >= 100000 ? id % 10000 : id;
    const key = all[String(base)] ? String(base) : kind === "augments" && base < 1000 && all[String(base + 1000)] ? String(base + 1000) : "";
    const p = key && all[key];
    if (!p) return "";
    const shield = (mechData.shield?.[kind] ?? []).includes(key);
    const big = (m) => Math.abs(p[m].change) >= (m === "deaths" ? 0.3 : 8);
    const fx = Object.keys(MECH_LABEL).filter((m) => p[m] && Math.abs(p[m].z) >= 3 && big(m) && !(shield && m === "healing"))
      .sort((a, b) => Math.abs(p[b].z) - Math.abs(p[a].z)).slice(0, 2)
      .map((m) => {
        const c = p[m].change, sign = c > 0 ? "+" : c < 0 ? "-" : "";
        return `${m === "deaths" ? `${sign}${Math.abs(c).toFixed(1)}` : `${sign}${Math.round(Math.abs(c))}%`} ${MECH_LABEL[m]}`;
      });
    return fx.length ? `What it does (estimated): ${fx.join(", ")}` : "";
  };
  const augIco = (id) => `<img class="ii round" src="${SITE}/icons/augments/${id}.webp" alt="" data-drop>`;
  const itemId = (icon) => Number((icon.match(/(\d+)\.png$/) ?? [])[1]) % 10000;
  // No taps in game (Nico 2026-11-24: "Mayhem is fast-paced and can't afford it"): nothing here waits on a click.
  let game = null, reached = {}, offer = [], closedAt = null;
  // Augment screens owed: levels 7/11/15 reached while watching whose screen hasn't come yet. A screen only opens with
  // the shop open (dead, or on the spawn platform), so one reached while alive waits for the next death (wiki).
  let owed = 0, sawOffer = false;
  // Item art lives at the champion build's icon path; mode copies use 22xxxx ids (base ids 404), and an icon that
  // still fails to load just disappears.
  let iconPrefix = "";
  const itemImg = (id, cls = "ii") => iconPrefix ? `<img class="${cls}" src="${(iconPrefix.startsWith("http") ? "" : SITE) + iconPrefix + (id < 10000 ? 220000 + id : id)}.png" alt="" data-drop>` : "";
  // The enemy team's physical/magic split as a bar, with their portraits: reads at a glance, no text to parse.
  function splitBar(magic) {
    const m = Math.round(magic * 100);
    return `<div class="split" title="Enemy damage: about ${100 - m}% physical, ${m}% magic"><span class="ad" data-style="width:${100 - m}%"></span><span class="ap" data-style="width:${m}%"></span></div>
      <div class="split-key"><span>Physical <b>${100 - m}%</b></span><span>Magic <b>${m}%</b></span></div>`;
  }
  // A new reading of the offer. Which card you took comes from the app, by the card you clicked (window.autoTaken).
  function setOffer(ids) {
    ids = ids ?? [];
    if (JSON.stringify(ids) === JSON.stringify(offer)) return false;
    const taken = game ? getTaken(game) : [];
    if (ids.length) {
      // A card that changed while the other two stayed was rerolled: neither it nor its replacement can be again.
      const kept = ids.filter((id) => offer.includes(id));
      // (3 cards, or 4 under Maestro)
      if (offer.length >= 3 && ids.length === offer.length && kept.length === ids.length - 1) {
        for (const id of [...offer, ...ids]) if (!kept.includes(id)) rerolled.add(id);
      }
      ids.forEach((id) => seen.add(id));
      sawOffer = true;
    } else if (offer.length && game) { closedAt = game.t; owed = Math.max(0, owed - 1); }
    offer = ids;
    return true;
  }
  // The champion's key in a data file, whatever its capitals (the game says "FiddleSticks", files may not).
  const keyIn = (obj, champ) => (obj && champ ? Object.keys(obj).find((k) => k.toLowerCase() === champ.toLowerCase()) : undefined);

  // What you took, kept per game (your champion plus when the game started) so a reopened window remembers.
  function readTaken() { try { return JSON.parse(localStorage.getItem("taken") ?? "null"); } catch { return null; } }
  function getTaken(g) {
    const s = readTaken(), start = Date.now() / 1000 - g.t;
    const mine = s && s.champ === g.champ && Math.abs(s.start - start) < 300 ? s.ids : [];
    return mine;
  }
  function setTaken(g, ids) {
    try { localStorage.setItem("taken", JSON.stringify({ champ: g.champ, start: Date.now() / 1000 - g.t, ids })); } catch {}
    renderQuick();
  }

  // DeepScore tier, as on the site: 50 is average, S from 70, A 59, B 44, C 32, D below.
  const deepTier = (ds) => (ds >= 70 ? "S" : ds >= 59 ? "A" : ds >= 44 ? "B" : ds >= 32 ? "C" : "D");
  const deepLabel = (ds) => (ds >= 0 ? `${deepTier(ds)} ${ds}` : "");

  // Ranking, reroll advice, the item path, swaps and tips come from the shared build engine (engine.js, built from
  // web/src/lib/engine/build-engine.ts), the same one Nico's PC app and the site use, so they can't drift. This page
  // only reads the game and draws.
  const E = window.DeepEngine;
  // "I'm feeling lucky" (Nico 2026-11-22): combos weigh much more, for chasing rare synergies. Off by default;
  // remembered on this PC.
  let lucky = (() => { try { return localStorage.getItem("lucky") === "1"; } catch { return false; } })();
  // Per game: every augment shown on a card (it can't come back) and the cards already rerolled (once each).
  let seen = new Set(), rerolled = new Set();
  const resetTrack = () => { seen = new Set(); rerolled = new Set(); };
  // "16.23+" (default: earlier patches pooled in where nothing changed, as the site) / "16.23 only" (Nico 2026-11-24).
  let onlyPatch = (() => { try { return localStorage.getItem("patchOnly") === "1"; } catch { return false; } })();
  const picksView = (d, ck) => (onlyPatch && d?.only?.[ck] ? { ...d, champions: { ...d.champions, [ck]: d.only[ck] } } : d);
  // tier: the screen on offer (the picks left are counted per partner tier). headliner: only once the game reports one.
  const rankAugments = (d, ck, taken, tier) => E.rankAugments(d, ck, taken, { lucky, seen: [...seen], tier, headliner: game?.headliner });
  function rerollAdvice(d, all, offered, taken) {
    const a = E.rerollAdvice(d, all, offered, taken, { seen: [...seen], rerolled: [...rerolled], headliner: game?.headliner });
    if (!a) return "";
    const nm = (id) => esc(d.augments[id]?.[0] ?? `#${id}`);
    const who = `${esc(label(game.champ))}'s ${esc(a.rarity ?? "")} augments`;
    return a.action === "reroll"
      ? `<div class="why tip reroll">Reroll ${augIco(a.card)}<b>${nm(a.card)}</b>: ${pct(a.beats)} of ${who} beat ${augIco(a.best)}<b>${nm(a.best)}</b>, worth about +${a.gain.toFixed(1)} on average.</div>`
      : `<div class="why tip reroll">Keep: ${a.beats ? `only ${pct(a.beats)}` : "none"} of ${who} beat ${augIco(a.best)}<b>${nm(a.best)}</b>, so a reroll is unlikely to help.</div>`;
  }

  async function renderAugments() {
    const box = document.getElementById("augs");
    if (!box || !game) return;
    const [d0] = await Promise.all([loadPicks(), loadMech()]);
    const ck = keyIn(d0?.champions, game.champ);
    if (!d0 || !ck) { box.innerHTML = `<p class="note">No augment ranking for this champion yet.</p>`; return; }
    const d = picksView(d0, ck);
    const pv = d0.patch ?? "This patch";
    const settings = [lucky ? "Feeling lucky" : "", onlyPatch && d0.only?.[ck] ? `${pv} only` : ""].filter(Boolean);
    const taken = getTaken(game);
    const name = (id) => d.augments[id]?.[0] ?? `#${id}`;
    const tier = offer.length ? d.augments[offer[0]]?.[1] : undefined;
    const ranked = rankAugments(d, ck, taken, tier);
    // An offer on screen: its augments side by side in ranking order (highlighted, never picked for you). The rest of
    // the list stays below for when the reading misses a card.
    const onOffer = offer.filter((id) => !taken.includes(id));
    const offered = onOffer.length ? [...ranked.filter((a) => onOffer.includes(a.id)), ...onOffer.filter((id) => !ranked.some((a) => a.id === id)).map((id) => ({ id, boost: null, deep: -1, mate: null, combo: null, potential: 0 }))] : [];
    const reroll = offered.length >= 2 ? rerollAdvice(d, ranked, offered, taken) : "";
    // Cards within noise of the best: highlighted too, "either is fine".
    const ties = offered.length >= 2 && offered.every((a) => typeof a.score === "number") ? E.nearTies(d, ck, offered) : [];
    // Can't decide between them: more combo potential, else the less common pick (Nico 2026-11-24).
    const tb = ties.length ? E.tieBreak(d, ck, [offered[0].id, ...ties], ranked) : null;
    const shown = ranked.filter((a) => !onOffer.includes(a.id)).slice(0, offered.length ? 5 : 8);
    const row = (a, best) => `
      <div class="row aug${best ? " best" : ""}" data-r="${d.augments[a.id]?.[1] ?? ""}"${whatItDoes("augments", Number(a.id)) ? ` title="${esc(whatItDoes("augments", Number(a.id)))}"` : ""}>
        ${augIcon(a.id)}
        <div><div class="name">${esc(name(a.id))}</div><div class="why">${a.conflict ? `Conflicts: ${esc(a.conflict)}` : a.mate !== null ? `Synergy with ${esc(name(a.mate))}` : a.combo !== null && a.potential >= 0.3 ? `Combo potential with ${esc(name(a.combo))} (+${a.potential.toFixed(1)})` : esc((d.augments[a.id]?.[1] ?? "").replace(/^./, (c) => c.toUpperCase()))}</div></div>
        <div class="num" title="DeepScore on this champion (ranking adds synergy with what you took)">${a.boost !== null ? `<b>${a.boost >= 0 ? "+" : ""}${a.boost.toFixed(1)}</b>` : ""}${a.deep >= 0 ? `${a.boost !== null ? "<br>" : ""}<small>${deepLabel(a.deep)}</small>` : a.boost === null && ranked.includes(a) ? `#${ranked.indexOf(a) + 1}` : ""}</div>
      </div>`;
    // What you took, learned from the card you clicked (no tap needed): shown, nothing to press.
    const took = taken.length ? `<div class="taken"><span class="why lbl">You took</span>${taken.map((id) => `<span class="chip aug" data-r="${d.augments[id]?.[1] ?? ""}">${augIcon(id)}${esc(name(id))}</span>`).join("")}</div>` : "";
    box.innerHTML = `${took}
      ${offered.length ? `<div class="offer"><div class="why src">${ties.length ? `On offer now: the highlighted cards are about equal for you (within noise), so pick either.${tb ? ` Can't decide? ${esc(name(tb.id))}: ${esc(tb.why)}.` : ""}` : "On offer now, best first for you."}</div>${offered.map((a, i) => row(a, i === 0 || ties.includes(a.id))).join("")}${reroll}</div><h2>Other augments</h2>` : ""}
      ${shown.map((a, i) => row(a, i === 0 && !offered.length)).join("")}
      <p class="note">Best first for ${esc(label(game.champ))}, by how each does on this champion in real games (DeepScore)${settings.length ? `. Set in champion select: ${esc(settings.join(", "))}` : ""}.</p>`;
  }

  const enemyMagic = (k, enemies) => E.enemyMagic(k, enemies);
  function damageLine(k, g, live = false) {
    const magic = enemyMagic(k, g.enemies ?? []);
    if (magic === null) return "";
    const lean = magic <= 0.35 || magic >= 0.65;
    if (live && !lean) return "";
    const v = live ? "is" : "was";
    if (!lean) return `The enemy team's damage ${v} mixed: about ${pct(magic)} magic.`;
    const kind = magic >= 0.65 ? "magic" : "physical";
    return `Enemy damage ${v} mostly ${kind}: about ${pct(magic >= 0.65 ? magic : 1 - magic)}.`;
  }

  // The banner's enemy strip: their portraits and their physical/magic split, updated as they buy items.
  function renderFoes(k) {
    const box = document.getElementById("foes");
    if (!box || !game || !k) return;
    const magic = enemyMagic(k, game.enemies ?? []);
    const foes = (game.enemies ?? []).filter((e) => e.champ);
    box.innerHTML = magic === null ? "" : `<div class="why lbl">Enemy team</div><div class="mates">${foes.map((e) => icon(e.champ)).join("")}</div>${splitBar(magic)}`;
  }

  async function renderItems() {
    const box = document.getElementById("items");
    if (!box || !game) return;
    const [d, k, picks, fitData, , whyData] = await Promise.all([loadBuilds(), loadKinds(), loadPicks(), loadFit(), loadMech(), loadWhy()]);
    const champ = d?.champions?.find((c) => c.id.toLowerCase() === game.champ.toLowerCase());
    if (champ?.items?.[0]?.icon) iconPrefix = champ.items[0].icon.replace(/\d+\.png$/, "");
    renderFoes(k);
    const p = E.plan({ champ, kinds: k, picks: picksView(picks, keyIn(picks?.champions, game.champ)), fit: fitData, game, taken: getTaken(game), lucky, why: whyData, profiles: mechData });
    const tipLines = p.tips.filter((t) => t.kind !== "shop");
    const shop = p.tips.find((t) => t.kind === "shop")?.text ?? "";
    const tipHtml = (t) => t.kind === "skill" ? `Skill point <span class="key inl">${esc(t.text)}</span>`
      : t.item != null ? `${itemImg(t.item)}${esc(t.text)}` : esc(t.text);
    const tip = tipLines.slice(0, 2).map((t) => `<div class="why tip">${tipHtml(t)}</div>`).join("");
    if (!p.path.length) { box.innerHTML = `<p class="note">No build for this champion yet.</p>` + tip; return; }
    // One full six-item path (Nico, 2026-11-23): the core, then the 4th/5th/6th picks, as icons labelled with their
    // slot. A real swap (an augment's item, or a counter that passed its test) takes the slot it replaces, with a
    // dashed gold ring; other lit situational items are options under the path. Owned items fade; next is ringed.
    const src = (u) => (u.startsWith("http") ? u : SITE + u);
    const owned = new Set(game.items.map((i) => i % 10000));
    const bootIds = new Set(k?.boots ?? []);
    const hasBoots = [...owned].some((i) => bootIds.has(i));
    const nextId = p.next[0] ? itemId(p.next[0].icon) : -1;
    const shown = p.path.map((it, i) => {
      const sw = p.swaps.find((x) => x.replaces && itemId(x.replaces.icon) === itemId(it.icon));
      // The hover: the engine's tested "why it's best" line (Nico approved 2026-11-23) when there is one, else the slot reason.
      const r = p.reasons?.[i];
      return sw ? { it: { ...sw.item, icon: sw.item.icon ?? it.icon }, why: `${sw.why} Replaces ${it.name}.`, sw: true, does: false }
        : { it, why: r?.text ?? p.why[i] ?? "", sw: false, does: r?.kind === "does" };
    });
    const state = (it) => {
      const id = itemId(it.icon);
      return owned.has(id) || (hasBoots && bootIds.has(id)) ? " own" : id === nextId ? " nx" : "";
    };
    const ord = (n) => `${n}${n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"}`;
    let n = 0;
    const tiles = shown.map(({ it, why, sw, does }, i) => {
      const boot = bootIds.has(itemId(it.icon));
      const lbl = boot ? "Boots" : ord(++n);
      return `${i === p.coreLen ? `<span class="gap"></span>` : ""}<div class="slot${state(it)}${sw ? " sw" : ""}" title="${esc([`${it.name} · ${why}`, does ? "" : whatItDoes("items", itemId(it.icon ?? ""))].filter(Boolean).join("\n"))}"><img src="${src(it.icon ?? "")}" alt="" data-drop><span>${lbl}</span></div>`;
    }).join("");
    const img = (it) => (it?.icon ? `<img class="ii" src="${src(it.icon)}" alt="" data-drop>` : "");
    const lower = (t) => esc(String(t ?? "").replace(/\.$/, "").replace(/^./, (c) => c.toLowerCase()));
    const lines = [
      p.switched ? `<div class="why tip lit">Build switched to <b>${esc(p.switched.style)}</b>${p.switched.because ? ` for ${esc(p.switched.because)}` : ""}.</div>` : "",
      ...p.swaps.map((x) => `<div class="why tip lit">${img(x.item)}<b>${esc(x.item.name)}</b>${x.replaces ? ` instead of ${img(x.replaces)}${esc(x.replaces.name)}` : ""}: ${lower(x.why)}.</div>`),
      ...p.lit.map((x) => `<div class="why tip lit">${img(x.item)}<b>${esc(x.item.name)}</b> fits this game: ${lower(x.why)}.</div>`),
      ...p.pointers.map((x) => `<div class="why tip lit">${img(x.item)}<b>${esc(x.item.name)}</b> is an option: ${lower(x.why)}.</div>`),
    ].join("");
    box.innerHTML = `<div class="box${shop ? " now" : ""}">
      ${shop ? `<div class="why">${esc(shop)}</div>` : ""}
      <div class="why lbl">Build${p.next[0] ? ` · next: <b>${esc(p.next[0].name)}</b>` : ""}</div>
      <div class="path">${tiles}</div>
      ${lines}
      ${p.next.length ? "" : `<p class="note">You have the whole build.</p>`}
      ${tip}</div>`;
  }

  window.showGame = (g) => {
    const prev = game;
    game = g;
    lastGame = { ...g, taken: getTaken(g) };
    lastChamp = g.champ;
    if (!document.getElementById("augs") || prev?.champ !== g.champ) {
      setView(`
        ${hero(g.champ, esc(label(g.champ)), "", "head").replace(/<\/div>$/, `<div class="foes" id="foes"></div></div>`)}
        <div class="cols">
        <section><h2>Quick build</h2><div id="quick"></div>
        <h2>Items</h2><div id="items"></div></section>
        <section><h2 id="augHead">Augments</h2>
        <div id="augs"></div></section>
        </div>`);
      renderQuick();
      renderAugments();
    }
    // "Augment pick" lights up for 90 seconds after each augment level, and stays lit only while one is untaken.
    if (!prev || prev.champ !== g.champ) { reached = {}; owed = 0; if (!offer.length) resetTrack(); }
    for (const l of AUGMENT_LEVELS) if (l <= g.level && reached[l] === undefined) { reached[l] = prev ? g.t : 0; if (prev && l > 1) owed++; }
    // Back from the dead: the shop was open, so any owed screen came, even if the reading missed it.
    if (prev?.dead && !g.dead) { if (!sawOffer && !offer.length) owed = 0; sawOffer = false; }
    // Lit while an offer is on screen or a screen is owed; "waiting" while alive (it comes at the next death).
    const waiting = owed > 0 && !offer.length && !g.dead;
    const pickNow = offer.length > 0 || owed > 0;
    const head0 = document.getElementById("head");
    head0.textContent = `In game · ${clock(g.t)} · Level ${g.level}${g.dead ? " · Dead: shop now" : ""}`;
    head0.classList.toggle("now", !!g.dead);
    // The owner's chance to win and surrender call: small, under the build, so the build stays the focus.
    let ff = document.getElementById("ff");
    if (!ff) { ff = document.createElement("div"); ff.id = "ff"; document.querySelector(".cols section")?.append(ff); }
    const l = g.live;
    const ffHtml = l ? `<div class="live-mini"><span>Chance to win <b data-style="color:${color(l.win)}">${pct(l.win)}</b></span>
        <div class="bar"><span data-style="width:${pct(l.win)};background:${color(l.win)}"></span></div></div>
      ${l.surrender ? `<div class="box yes">Surrender: yes. A new game is worth more than this one now.</div>` : ""}` : "";
    // Redrawn only when it changes, to keep the window's work small during a game.
    if (ff.lastHtml !== ffHtml) { ff.lastHtml = ffHtml; ff.innerHTML = ffHtml; }
    const head = document.getElementById("augHead");
    head.textContent = waiting ? "Augment waiting: it comes at your next death" : pickNow ? "Augment pick: best first" : "Augments";
    head.classList.toggle("now", pickNow);
    // Only what the item advice reads: attack speed near its cap and ability haste from 100 (in steps of 10), so a
    // buff that ticks attack speed up and down doesn't redraw the items every two seconds.
    const key = (x) => JSON.stringify([x.champ, x.items, x.dead, x.t < 60, x.t >= 600, x.enemies, x.skills, x.level, x.stats && [x.stats[1] >= 4.5, x.stats[2] >= 100 ? Math.floor(x.stats[2] / 10) : 0], x.dead && Math.round((x.gold ?? 0) / 100)]);
    if (setOffer(g.offer)) renderAugments();
    if (!prev || key(prev) !== key(g)) renderItems();
    // Before the first buy, extra gold (the Debonair headliner pays gold per augment pick) can change the start.
    if (!bought(g) && prev && Math.round((prev.gold ?? 0) / 50) !== Math.round((g.gold ?? 0) / 50)) renderQuick();
  };

  // The offer changed (read off the screen the moment it did): re-rank right away instead of at the next update.
  window.showOffer = (ids) => {
    if (setOffer(ids) && game) {
      renderAugments();
      const h = document.getElementById("augHead");
      if (h && offer.length) { h.textContent = "Augment pick: best first"; h.classList.add("now"); }
    }
  };

  // The app saw which card you clicked as the offer closed: that's your pick. It re-ranks the rest and re-plans the
  // items around it, with nothing to tap (Nico 2026-11-24: no taps in game).
  window.autoTaken = (id) => {
    if (!game) return;
    const t = getTaken(game);
    if (t.includes(id)) return;
    setTaken(game, [...t, id]);
    renderAugments();
    renderItems();
  };

  // Bought anything yet (Poro-Snax, which ARAM hands out, doesn't count)?
  const bought = (g) => (g.items ?? []).some((i) => i % 10000 !== 2052);

  // The champion's quick build, as on the site's card: skill order and spells (the items are just above, live).
  async function renderQuick() {
    const box = document.getElementById("quick");
    if (!box || !game) return;
    const d = await loadBuilds();
    const c = d?.champions?.find((x) => x.id.toLowerCase() === game.champ.toLowerCase());
    if (!c) { box.innerHTML = `<p class="note">No quick build for this champion yet.</p>`; return; }
    const b = (c.builds ?? []).length > 1 ? { ...c, ...c.builds[0] } : c;
    const src = (u) => (u?.startsWith("http") ? u : SITE + (u ?? ""));
    // The first augment can change the start (Upgrade Stormsurge: Hextech Alternator), as the engine says.
    // With extra gold (Debonair, Upgrade augments) the rest goes on the first item's parts (engine goldFill).
    const k = await loadKinds();
    const st = E.startFor ? E.startFor(b, getTaken(game), bought(game) ? undefined : game.gold, k) : { start: b.start ?? [], augment: null };
    box.innerHTML = `<div class="quick">
      <div class="keys"${b.skillSplit ? ` title="Your pick, estimated"` : ""}>${b.skillSplit ? `<span class="key">${esc(b.skillSplit.first)}</span><span class="why">to ${b.skillSplit.points}, then</span>` : ""}${(b.skills ?? []).map((k, i) => `${i ? `<span class="why">›</span>` : ""}<span class="key">${esc(k)}</span>`).join("")}</div>
      ${(b.spells ?? []).map((sp) => `<span class="spell"><img src="${src(sp.icon)}" alt="">${esc(sp.name)}</span>`).join("")}
      ${st.start.length ? `<span class="spell"${st.filled ? ` title="You have extra gold: spend it on these parts"` : st.augment ? ` title="Changed by your first augment"` : st.rich ? ` title="You have extra gold to start"` : ""}>Start ${st.start.map((it) => `<img src="${src(it.icon)}" alt="" title="${esc(it.name)}">`).join("")}</span>` : ""}
    </div>`;
  }

  // The app's page rules block inline handlers (onclick=, onerror=), so these listen on the document instead.
  document.addEventListener("click", (e) => {
    if (e.target.closest?.(".hero .fs")) fullScreen();
    const pt = e.target.closest?.(".chip.pt");
    if (pt) {
      onlyPatch = pt.dataset.o === "1";
      try { localStorage.setItem("patchOnly", onlyPatch ? "1" : "0"); } catch {}
      document.querySelectorAll(".chip.pt").forEach((x) => x.classList.toggle("on", (x.dataset.o === "1") === onlyPatch));
      renderAugments();
      renderItems();
      return;
    }
    const br = e.target.closest?.(".chip.br");
    if (br) {
      bracket = br.dataset.b;
      try { localStorage.setItem("bracket", bracket); } catch {}
      if (lastPick) window.showPick(lastPick);
    }
    const l = e.target.closest?.(".chip.lucky");
    if (l) {
      lucky = !lucky;
      l.classList.toggle("on", lucky);
      try { localStorage.setItem("lucky", lucky ? "1" : "0"); } catch {}
      renderAugments();
      renderItems();
    }
  });
  // The page rules also drop style="" attributes (Tauri's nonce turns off 'unsafe-inline'), which left the bars
  // empty: widths and colors ride in data-style and are set from script, which the rules allow.
  const restyle = (el) => { el.style.cssText = el.dataset.style; el.removeAttribute("data-style"); };
  new MutationObserver((list) => { for (const m of list) for (const n of m.addedNodes) if (n.nodeType === 1) {
    if (n.dataset.style !== undefined) restyle(n);
    n.querySelectorAll("[data-style]").forEach(restyle);
  } })
    .observe(document.body, { childList: true, subtree: true });
  document.addEventListener("error", (e) => { if (e.target.matches?.("img[data-drop]")) e.target.remove(); }, true);
  // Esc leaves full screen, F11 flips it.
  addEventListener("keydown", (e) => {
    if ((e.key === "Escape" || e.key === "F11") && window.__TAURI_INTERNALS__) {
      e.preventDefault();
      fullScreen(e.key === "F11" ? !isFull : false);
    }
  });

  window.showOver = () => {
    game = null;
    resetTrack();
    offer = [];
    closedAt = null;
    owed = 0;
    setView(`${hero(lastChamp, "Game over", "The review shows after games of 5 minutes or more")}`);
  };

  // The game's result from the League client's end-of-game screen, when the game's own feed closed before saying it.
  window.setResult = (result) => {
    const t = document.querySelector(".hero .title");
    if (!t || game || !/^(Game over)$/.test(t.textContent)) return;
    t.innerHTML = result === "Win" ? `<span class="ink">Victory</span>` : result === "Lose" ? "Defeat" : t.innerHTML;
    // The result often lands after the review is up: the invitation waits for it.
    if (result === "Win" && document.getElementById("invite")) inviteToShare();
  };

  window.showReview = ({ points, turns, ffFrom, result }) => {
    game = null;
    const verdict = result === "Win" ? "Victory" : result === "Lose" ? "Defeat" : "Game over";
    const turnRows = turns.map((t) => `
      <div class="box"><span class="${t.after >= t.before ? "up" : "down"}">${t.after >= t.before ? "▲" : "▼"}</span> ${clock(t.from)}–${clock(t.to)}: ${pct(t.before)} → <b data-style="color:${color(t.after)}">${pct(t.after)}</b>
        <div class="why">${t.kills >= 0 ? "+" : "−"}${Math.abs(t.kills)} kills${t.towers ? `, ${t.towers > 0 ? "+" : "−"}${Math.abs(t.towers)} towers` : ""} for your team</div></div>`).join("");
    // The surrender call: the chance stayed under the line for a full minute (Nico approved the full-minute hold,
    // 2026-11-23).
    const ff = ffFrom != null
      ? `<div class="box yes">From ${clock(ffFrom)} a surrender would have saved time: the chance stayed under the line for a full minute.</div>`
      : `<div class="box">A surrender never paid off this game.</div>`;
    setView(`
      ${hero(lastChamp, `<span class="${result === "Win" ? "ink" : ""}">${verdict}</span>`, "Game review")}
      <h2>Chance to win over the game</h2>
      ${chart(points, ffFrom)}
      ${turnRows ? `<h2>Turning points</h2>${turnRows}` : ""}
      <h2>Surrender</h2>${ff}
      <p class="note">Predicted, not measured: an estimate from kills, towers, levels and team strength.</p>
      <div id="recap"></div><div id="invite"></div>`);
    renderRecap();
    if (result === "Win") inviteToShare();
  };

  // After a won game, now and then: a dismissible invitation to share match data (game data only, never names or
  // accounts). Never in game; at most once every two weeks, three times in all, and never again after "Don't ask".
  async function inviteToShare() {
    const box = document.getElementById("invite");
    if (!box || !window.__TAURI_INTERNALS__) return;
    const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
    let st = { n: 0, at: 0, never: false };
    try { st = { ...st, ...JSON.parse(localStorage.getItem("shareInvite") ?? "{}") }; } catch {}
    if (st.never || st.n >= 3 || Date.now() - st.at < 14 * 864e5) return;
    if (await invoke("share_status").catch(() => true)) return;
    const save = (x) => { try { localStorage.setItem("shareInvite", JSON.stringify({ ...st, ...x })); } catch {} };
    save({ n: st.n + 1, at: Date.now() });
    box.innerHTML = `<div class="box invite"><b>Nice win.</b> Want to help DeepARAM's builds get sharper? Share your Mayhem games: champions, items, augments and the result only, never your name or account. You can turn it off any time from the tray, which removes what was sent.
      <div class="filters" data-style="margin:10px 0 0"><button class="chip on" data-share="yes">Share my games</button><button class="chip" data-share="later">Not now</button><button class="chip" data-share="never">Don't ask again</button></div></div>`;
    box.querySelectorAll("[data-share]").forEach((b) => b.addEventListener("click", () => {
      const v = b.dataset.share;
      if (v === "yes") invoke("share_choice", { enabled: true }).catch(() => {});
      if (v === "never") save({ never: true });
      box.innerHTML = v === "yes" ? `<div class="box">Thanks! Sharing is on. The tray's "Share match data" turns it off.</div>` : "";
    }));
  }

  // What you built and took this game, and what the enemy hit you with: kept off the in-game screen, shown here.
  async function renderRecap() {
    const box = document.getElementById("recap");
    const g = lastGame;
    if (!box || !g) return;
    const [d, k, p] = await Promise.all([loadBuilds(), loadKinds(), loadPicks()]);
    const champ = d?.champions?.find((c) => c.id.toLowerCase() === g.champ.toLowerCase());
    const prefix = (champ?.items?.[0]?.icon ?? "").replace(/\d+\.png$/, "");
    const src = (u) => (u.startsWith("http") ? u : SITE + u);
    const items = g.items.filter((i) => (k?.recipes[i % 10000]?.[1] ?? 0) >= 1000);
    const itemRow = prefix && items.length
      ? `<div class="tiles">${items.map((i) => `<div class="tile"><img src="${src(prefix + (i < 10000 ? 220000 + i : i) + ".png")}" alt="" data-drop>${esc(k?.recipes[i % 10000]?.[0] ?? `#${i}`)}</div>`).join("")}</div>`
      : "";
    const augs = g.taken.length
      ? `<div class="tiles">${g.taken.map((id) => `<div class="tile aug" data-r="${p?.augments?.[id]?.[1] ?? ""}">${augIcon(id)}${esc(p?.augments?.[id]?.[0] ?? `#${id}`)}</div>`).join("")}</div>`
      : "";
    const magic = k ? enemyMagic(k, g.enemies ?? []) : null;
    const dmg = magic === null ? "" : `<div class="why">${esc(damageLine(k, g))}</div><div class="mates" data-style="margin-top:6px">${(g.enemies ?? []).filter((e) => e.champ).map((e) => icon(e.champ)).join("")}</div>${splitBar(magic)}`;
    if (!itemRow && !augs && !dmg) return;
    box.innerHTML = `<h2>Your build</h2>
      ${augs ? `<div class="box"><div class="why">Augments you took</div>${augs}</div>` : ""}
      ${itemRow ? `<div class="box"><div class="why">Items at the end</div>${itemRow}</div>` : ""}
      ${dmg ? `<div class="box">${dmg}</div>` : ""}`;
  }
</script>
</body>
</html>
