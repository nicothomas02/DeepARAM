<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepARAM</title>
<style>
  /* The companion window (src-tauri/src/companion.rs): a normal window for a second screen, in the site's dark look. */
  /* Mona Sans, the site's typeface, shipped with the app. */
  @font-face { font-family: "Mona Sans"; font-style: normal; font-weight: 200 900; font-display: swap; src: url(fonts/mona-sans-latin.woff2) format("woff2"); }
  :root { color-scheme: dark; --prismatic: linear-gradient(100deg, #9fe7ff, #c9b8ff 40%, #ffb8e0 70%, #ffe2a3); --silver: #a3adbb;
    --depth: inset 0 1px 0 rgb(255 255 255 / .06), 0 1px 2px rgb(0 0 0 / .4), 0 4px 12px rgb(0 0 0 / .35); --bg: #090b0f; --surface: #11151c; --raised: #181d26; --fg: #e8ecf2; --muted: #8b94a3;
    --line: #222936; --accent: #5cc0ff; --good: #4cc98b; --bad: #f0776f; --gold: #e0b45c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.4 "Mona Sans", "Segoe UI Variable", "Segoe UI", Cantarell, "Noto Sans", system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; }
  .row { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; }
  .row.best { border-color: var(--accent); }
  .pickn { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; } .pickn small { color: var(--muted); font-size: 11px; }
  .pickn .tm b { font-size: 18px; } .pickn .up { color: var(--good); } .pickn .down { color: var(--bad); } .pickn .flat { color: var(--muted); }
  .row .dice { width: 36px; height: 36px; border-radius: 8px; background: var(--raised); display: grid; place-items: center; font-size: 22px; }
  .row.roll { border-style: dashed; } .row.roll.up { border-color: var(--gold); } .row.roll .tm b.up { color: var(--gold); }
  .spells { display: flex; align-items: center; gap: 12px; margin: 12px 0 6px; }
  .spells img { width: 64px; height: 64px; border-radius: 12px; box-shadow: 0 0 0 3px var(--accent); }
  .bestteam { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .bestteam img { width: 36px; height: 36px; border-radius: 8px; } .bestteam .in img { box-shadow: 0 0 0 3px var(--good); } .bestteam .out img { opacity: .5; filter: grayscale(1); }
  .bestteam .swap { display: flex; align-items: center; gap: 4px; font-size: 20px; font-weight: 800; color: var(--good); }
  .bestteam .gain { font-size: 22px; font-weight: 800; color: var(--good); } .bestteam .keep { color: var(--good); font-weight: 700; }
  .row img, .mates img { width: 36px; height: 36px; border-radius: 8px; background: var(--raised); }
  .name { font-weight: 600; }
  .why { color: var(--muted); font-size: 12px; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
  .mates { display: flex; gap: 6px; }
  .mates img { width: 28px; height: 28px; }
  .teamline { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .teamds { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .teamds.up { color: var(--good); } .teamds.down { color: var(--bad); }
  .big { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .bar { height: 14px; border-radius: 7px; background: var(--raised); overflow: hidden; margin: 12px 0; }
  .bar span { display: block; height: 100%; }
  .box { padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-top: 10px; }
  .box.yes { border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  svg { width: 100%; height: 140px; display: block; margin-top: 8px; }
  button.row { width: 100%; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  button.row:hover { border-color: var(--muted); }
  h2.now { color: var(--accent); }
  input[type=search] { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; margin-bottom: 8px; }
  .why.bad { color: var(--bad); }
  .badge { display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 8px; font-size: 16px; font-weight: 800; }
  .badge.green { color: #07130d; background: var(--good); } .badge.blue { color: #04131d; background: var(--accent); }
  .num.big { font-size: 22px; font-weight: 800; } .num.green { color: var(--good); } .num.gold { color: var(--gold); } .num.red { color: var(--bad); }
  .num.t-s { color: #e0573f; } .num.t-a { color: #f0913a; } .num.t-b { color: #e6c24a; } .num.t-c { color: #7fb6e8; } .num.t-d { color: #8b93a3; }
  .row.card { padding: 10px 12px; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .dim .row { opacity: .55; padding: 5px 8px; font-size: 12px; } .dim .row .name { font-size: 13px; }
  /* In-game cues (Nico 2026-11-24: icons and pictures, required text larger and coloured). */
  .cue { font-size: 15px; font-weight: 600; margin-top: 8px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .cue .ii { width: 20px; height: 20px; vertical-align: middle; margin: 0; }
  .cue.gold { color: var(--gold); } .cue.blue { color: var(--accent); } .cue.green { color: var(--good); } .cue.red { color: var(--bad); }
  .cue.sm { font-size: 13px; margin-top: 2px; }
  .cue .key.inl { font-size: 17px; min-width: 28px; height: 28px; border-radius: 8px; }
  h2.now { font-size: 16px; }
  @media (min-width: 900px) { .cue { font-size: 18px; } .cue .ii { width: 24px; height: 24px; } }
  .taken { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .chip { display: flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
    background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 3px; }
  .chip img { width: 22px; height: 22px; border-radius: 50%; }
  .items { display: grid; gap: 8px; }
  .item { display: flex; gap: 10px; align-items: center; }
  .item img { width: 32px; height: 32px; border-radius: 6px; }
  .box.now { border-color: var(--gold); }
  .why.lbl { margin: 10px 0 6px; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; font-weight: 600; }
  .why.lbl:first-child, .box > .why:first-child + .why.lbl { margin-top: 0; }
  .core { display: flex; gap: 6px; flex-wrap: wrap; }
  .core img { width: 40px; height: 40px; border-radius: 8px; }
  .core img.own, .item.own { opacity: .35; }
  .core img.nx, .item.nx img { box-shadow: 0 0 0 2px var(--gold); }
  .items.lst { gap: 6px; }
  .items.lst .item img { width: 28px; height: 28px; }
  .item.lit .why { color: var(--gold); }
  .path { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; }
  .path .gap { width: 8px; }
  .slot { display: grid; justify-items: center; gap: 3px; font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .slot img { width: 40px; height: 40px; border-radius: 8px; }
  .slot.own { opacity: .35; }
  .slot.nx img { box-shadow: 0 0 0 2px var(--gold); }
  .slot.nx span { color: var(--gold); }
  .slot.sw img { outline: 2px dashed var(--gold); outline-offset: 1px; }
  .tip.lit { color: var(--gold); }
  @media (min-width: 1000px) { .slot img { width: 52px; height: 52px; } .slot { font-size: 11px; } }
  .offer .reroll { margin: 8px 2px 2px; }
  .why.lbl b { text-transform: none; letter-spacing: 0; }
  .items.lst .why.lbl { margin: 4px 0 -2px; }
  .tip { margin-top: 8px; }
  .plan { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .plan .keys { font-size: 16px; } .plan .spells img { width: 36px; height: 36px; } .buildline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .corebox { position: relative; display: inline-flex; gap: 6px; padding: 14px 6px 5px; border: 1px dashed color-mix(in srgb, var(--muted) 45%, transparent); border-radius: 10px; background: color-mix(in srgb, var(--muted) 6%, transparent); align-items: flex-start; }
  .corebox > .lbl { position: absolute; top: 2px; right: 8px; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  .aug .num.big { font-size: 17px; white-space: nowrap; }
  .plan .keys b { color: var(--accent); }
  .filters { display: flex; gap: 6px; margin-bottom: 8px; }
  .chip.f, .chip.br { padding: 3px 10px; }
  .chip.on { color: var(--fg); border-color: var(--accent); }
  .aug { padding: 6px 10px; margin-bottom: 4px; }
  .aug img { width: 30px; height: 30px; }
  .tip b { color: var(--fg); }
  .offer { border: 1px solid var(--accent); border-radius: 14px; padding: 8px; margin-bottom: 10px; }
  .offer .why.src { margin: 2px 4px 6px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .quick .keys { display: flex; gap: 4px; align-items: center; }
  .quick .key { min-width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; background: var(--raised); font-weight: 600; font-size: 12px; }
  .quick .spell { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .quick img { width: 24px; height: 24px; border-radius: 6px; }
  /* Full screen on a second monitor: three columns, bigger type so it reads at a glance. */
  @media (min-width: 1000px) {
    body { font-size: 16px; padding: 28px 36px; }
    main { max-width: 1500px; margin: 0 auto; }
    .cols { display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px; align-items: start; }
    .cols > section > h2:first-child { margin-top: 0; }
    .aug img, .row img { width: 40px; height: 40px; }
    .row { grid-template-columns: 40px 1fr auto; }
    .why, .num, .note { font-size: 14px; }
  }
  /* The site's look: a header glowing in the champion's colour, cards with depth, rarity rings, the prismatic flourish. */
  .row, .box { box-shadow: var(--depth); }
  .hero { position: relative; display: flex; align-items: flex-end; gap: 14px; min-height: 132px; padding: 16px 18px; margin: -4px 0 14px;
    border-radius: 18px; border: 1px solid var(--line); overflow: hidden; background: var(--surface); box-shadow: var(--depth); }
  /* The site's champion-page glow (globals.css .cp-hero-glow), in the champion's colour; the site's blue without one. */
  .hero::before { content: ""; position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(ellipse 55% 90% at 88% 10%, hsl(var(--champ-h, 205) var(--champ-s, 70%) 50% / 0.55), transparent 70%),
      radial-gradient(ellipse 45% 70% at 62% 105%, hsl(calc(var(--champ-h, 205) + 35) var(--champ-s, 70%) 45% / 0.35), transparent 70%),
      linear-gradient(115deg, transparent 35%, hsl(var(--champ-h, 205) 40% 30% / 0.25));
    mask-image: linear-gradient(90deg, transparent 10%, #000 70%); }
  .hero > * { position: relative; z-index: 2; }
  .hero > img { width: 56px; height: 56px; border-radius: 14px; border: 2px solid rgb(255 255 255 / .15); }
  .hero .title { font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
  .hero .sub { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-top: 4px; }
  .hero .sub.now { color: var(--accent); }
  .live-mini { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--muted); }
  .live-mini .bar { flex: 1; height: 6px; margin: 0; }
  /* At-a-glance visuals: physical/magic split bar, enemy strip in the banner, strength bars, icon tiles. */
  .split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--raised); margin: 6px 0 4px; }
  .split .ad { background: #e8845a; } .split .ap { background: #7f8cff; }
  .split-key { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .split-key b { color: var(--fg); }
  .hero.slim { min-height: 0; padding: 10px 16px; align-items: center; margin-bottom: 12px; }
  .hero.slim > img { width: 40px; height: 40px; border-radius: 10px; } .hero.slim .title { font-size: 20px; } .hero.slim .foes { align-self: center; }
  @media (max-width: 999px) { .cols { display: flex; flex-direction: column; } .cols.offer-up > #augSec { order: -1; } }
  .slot { position: relative; align-content: start; } .slot.nx { transform: scale(1.1); transform-origin: center bottom; margin: 0 4px; }
  .slot svg.arr { position: absolute; top: -14px; left: 50%; margin-left: -6px; color: var(--gold); width: 12px; height: 12px; }
  .slot .pbar { display: block; margin: 0; width: 100%; height: 3px; border-radius: 2px; background: var(--raised); overflow: hidden; } .slot .pbar b { display: block; height: 100%; background: var(--gold); }
  details.best > summary { cursor: pointer; list-style: none; } details.best > summary h2 { display: inline; } details.best > summary::-webkit-details-marker { display: none; } details.best > summary::before { content: "▸ "; } details.best[open] > summary::before { content: "▾ "; }
  svg.i, svg.arr { display: inline-block; width: 1em; height: 1em; margin: 0; vertical-align: -0.125em; flex: none; }
  .badge { display: inline-flex; align-items: center; gap: 5px; }
  .foes { margin-left: auto; min-width: 170px; max-width: 220px; align-self: flex-end; }
  .foes .mates img { width: 26px; height: 26px; border-radius: 7px; }
  .foes .why.lbl { margin: 0 0 4px; }
  .sbar { height: 4px; border-radius: 2px; background: var(--raised); margin-top: 5px; overflow: hidden; max-width: 160px; }
  .sbar span { display: block; height: 100%; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; margin-top: 6px; }
  .tile { display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 11px; line-height: 1.2; }
  .tile img { width: 40px; height: 40px; border-radius: 8px; }
  .tile.aug img { border-radius: 50%; }
  .chg { display: flex; align-items: center; gap: 8px; } .chg img { width: 36px; height: 36px; border-radius: 6px; } .chg .d { margin-left: auto; font-size: 18px; font-weight: 700; }
  .chg .d.up, .chg .ok { color: var(--good); } .chg .d.down { color: var(--bad); }
  .deadshop { display: flex; gap: 6px; padding: 6px; margin-bottom: 6px; border: 2px solid var(--good); border-radius: 10px; } .deadshop img { width: 44px; height: 44px; border-radius: 6px; }
  .ii { width: 18px; height: 18px; border-radius: 4px; vertical-align: -4px; margin-right: 3px; }
  .ii.round { border-radius: 50%; }
  .key.inl { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 6px; background: var(--raised); color: var(--accent); font-weight: 700; font-size: 12px; margin-left: 2px; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .hero .fs { position: absolute; top: 10px; right: 10px; z-index: 2; font: inherit; font-size: 11px; font-weight: 600; color: var(--text, #fff);

  .ink { background: var(--prismatic); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .offer { border: 1px solid transparent; background: linear-gradient(var(--bg), var(--bg)) padding-box, var(--prismatic) border-box; }
  .offer.ask { background: linear-gradient(var(--bg), var(--bg)) padding-box, linear-gradient(90deg, var(--gold), var(--gold)) border-box; }
  .aug[data-r="prismatic"] img { box-shadow: 0 0 0 2px #c9b8ff; }
  .aug[data-r="gold"] img { box-shadow: 0 0 0 2px var(--gold); }
  .aug[data-r="silver"] img { box-shadow: 0 0 0 2px var(--silver); }
  .aug img { border-radius: 50%; }
  body.idle { background: var(--bg) url(art/howling-abyss.webp) center / cover no-repeat; min-height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; }
  .brand b { font-size: 20px; letter-spacing: -.01em; }
  @media (min-width: 1000px) { .hero { min-height: 220px; padding: 24px 28px; } .hero .title { font-size: 34px; } .hero > img { width: 72px; height: 72px; }
    .hero.slim { min-height: 0; padding: 12px 20px; } .hero.slim .title { font-size: 24px; } .hero.slim > img { width: 48px; height: 48px; } }
  [hidden] { display: none !important; }
</style>

  function chart(points, from) {

  // In game, for everyone: the augment ranking for your champion (tap what you took, the rest re-rank by synergy with

  let calls = [], appCall = null, lastNext = -1, reviewPoints = [];
  const loadKinds = () => kinds ?? (kinds = fetch(`${SITE}/data/damage-types.json`).then((r) => r.json()).catch(() => null));

  const augIcon = (id) => `<img src="${SITE}/icons/augments/${id}.webp" alt="">`;
  // "What it does (estimated)": the same rule as the site's lib/mechanisms.ts whatItDoes (|z| >= 3, at least 8% a
  // minute or 0.3 deaths per 10 minutes, largest |z| first, at most 2, no healing line on picks that shield). Hover only.
  let mech = null, mechData = null;

  const loadMech = () => mech ?? (mech = fetch(`${SITE}/data/mechanism-profiles.json`).then((r) => r.json()).then((j) => (mechData = j)).catch(() => null));
  const MECH_LABEL = { damage: "damage to champions", healing: "healing", mitigated: "damage blocked", cc: "crowd control", deaths: "deaths per 10 minutes" };
  const whatItDoes = (kind, id) => {
    const all = mechData?.[kind];
    if (!all) return "";
    const base = kind === "items" && id >= 100000 ? id % 10000 : id;
    const key = all[String(base)] ? String(base) : kind === "augments" && base < 1000 && all[String(base + 1000)] ? String(base + 1000) : "";
    const p = key && all[key];
    if (!p) return "";
    const shield = (mechData.shield?.[kind] ?? []).includes(key);
    const big = (m) => Math.abs(p[m].change) >= (m === "deaths" ? 0.3 : 8);
    const fx = Object.keys(MECH_LABEL).filter((m) => p[m] && Math.abs(p[m].z) >= 3 && big(m) && !(shield && m === "healing"))
      .sort((a, b) => Math.abs(p[b].z) - Math.abs(p[a].z)).slice(0, 2)
      .map((m) => {

  };
  const augIco = (id) => `<img class="ii round" src="${SITE}/icons/augments/${id}.webp" alt="" data-drop>`;
  const itemId = (icon) => Number((icon.match(/(\d+)\.png$/) ?? [])[1]) % 10000;
  // No taps in game (Nico 2026-11-24: "Mayhem is fast-paced and can't afford it"): nothing here waits on a click.
  let game = null, reached = {}, offer = [], closedAt = null;
  // Augment screens owed: levels 7/11/15 reached while watching whose screen hasn't come yet. A screen only opens with
  // the shop open (dead, or on the spawn platform), so one reached while alive waits for the next death (wiki).
  let owed = 0, sawOffer = false;
  // Item art lives at the champion build's icon path; mode copies use 22xxxx ids (base ids 404), and an icon that

  // Finished items have Mayhem art (220000 + id); parts only the plain id: try one, fall back to the other (data-alt).
  const itemImg = (id, cls = "ii") => { if (!iconPrefix) return ""; const b = (iconPrefix.startsWith("http") ? "" : SITE) + iconPrefix, m = id < 10000 ? 220000 + id : id, plain = m % 10000;

  // The enemy team's physical/magic split as a bar, with their portraits: reads at a glance, no text to parse.

  // A new reading of the offer. Which card you took comes from the app, by the card you clicked (window.autoTaken).

  const keyIn = (obj, champ) => (obj && champ ? Object.keys(obj).find((k) => k.toLowerCase() === champ.toLowerCase()) : undefined);

  // Icons as inline SVG in the text colour (Nico 2026-11-24, as PC 1.26.9), not emoji glyphs.
  const SVG = {

    bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" fill="currentColor"/>',
    swap: '<path d="M4 8h14l-4-4M20 16H6l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    reroll: '<path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',

    approx: '<path d="M4 9.5c2.5-2.5 5.5 1.5 8 0s5.5-2.5 8 0M4 15.5c2.5-2.5 5.5 1.5 8 0s5.5-2.5 8 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
    star: '<path d="m12 2.5 2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8L12 2.5z" fill="currentColor"/>',
    up: '<path d="M12 20V5M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
    down: '<path d="M4 7h16l-8 11z" fill="currentColor"/>',
    plus: '<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
    dice: '<rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/><circle cx="15" cy="15" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/>',

  const deepTier = (x) => { const ds = Math.round(x); return ds >= 70 ? "S" : ds >= 59 ? "A" : ds >= 44 ? "B" : ds >= 32 ? "C" : "D"; };

  // Ranking, reroll advice, the item path, swaps and tips come from the shared build engine (engine.js, built from

  // "16.23+" (default: earlier patches pooled in where nothing changed, as the site) / "16.23 only" (Nico 2026-11-24).

  const picksView = (d, ck) => (onlyPatch && d?.only?.[ck] ? { ...d, champions: { ...d.champions, [ck]: d.only[ck] } } : d);

    // In game only a glance (Nico 2026-11-24: a few seconds per alt-tab): the cue, with the reason on hover.
    const plain = (id) => d.augments[id]?.[0] ?? `#${id}`;
    // Reroll: the card's own badge says it (reason on its hover). Keep: one line under the cards.
    return a.action === "reroll"
      ? { card: a.card, html: "", why: `${pct(a.beats)} of ${label(game.champ)}'s ${a.rarity ?? ""} augments beat ${plain(a.best)}, worth about +${a.gain.toFixed(1)} on average.` }
      : { card: null, html: `<div class="cue green" title="${esc(`${a.beats ? `Only ${pct(a.beats)}` : "None"} of ${label(game.champ)}'s ${a.rarity ?? ""} augments beat ${plain(a.best)}. A reroll is unlikely to help.`)}">✓ Keep, no reroll</div>` };

  function gameDeep(d, ck, score) {

  async function renderAugments() {

  const enemyMagic = (k, enemies) => E.enemyMagic(k, enemies);

  async function renderItems() {
    const box = document.getElementById("items");

    if (champ?.items?.[0]?.icon) iconPrefix = champ.items[0].icon.replace(/\d+\.png$/, "");
    renderFoes(k);
    const p = E.plan({ champ, kinds: k, picks: picksView(picks, keyIn(picks?.champions, game.champ)), fit: fitData, game, taken: getTaken(game), lucky, why: whyData, profiles: mechData });
    const tipLines = p.tips.filter((t) => t.kind !== "shop");
    const shop = p.tips.find((t) => t.kind === "shop")?.text ?? "";
    // In game: the action only (a key to level, an item to buy or sell), the sentence on hover. Notes that ask
    // nothing of you (haste maths, the attack-speed cap) stay out (Nico 2026-11-24: seconds per alt-tab).
    // As PC 1.26.18: a word and an icon; timing and stacking tips are gone (the item being built carries its reason on
    // hover). A skill point only when an augment changed the max order, a split is still owed, or Back to Basics skips R.
    const augOrder = (p.rules ?? []).some((r) => r === "augmentSkills" || r === "archmageRoute");
    const split = !augOrder ? champ?.skillSplit : null;
    const si = split ? ({ Q: 0, W: 1, E: 2 }[split.first] ?? -1) : -1;
    const inSplit = si >= 0 && (game.skills ?? [])[si] < split.points;
    const skillCue = augOrder || inSplit || getTaken(game).some((id) => id === 1004 || id === 4);
    const nextId0 = p.next[0] ? itemId(p.next[0].icon) : -1;
    const ACT = { skill: "Level", buy: "Buy", sell: "Sell", cap: "AS cap", anvil: "Buy", elixir: "Buy" };
    const tipHtml = (t) => t.kind === "skill" ? `${ico("up")} <span class="key inl">${esc(t.text)}</span>`
      : t.kind === "buy" && t.item === nextId0 ? "Buy now"
      : t.kind === "cap" ? `${ico("warn")} AS cap`
      : `${ACT[t.kind]} ${t.item != null && itemImg(t.item) ? itemImg(t.item) : esc(tipItem(t))}`;
    // The item's name, from the engine's sentence ("Buy B. F. Sword now...", "Full build: sell X for Y.").
    function tipItem(t) {
      const m = /^Buy (.+?) now/.exec(t.text) ?? /buys (.+?) now/.exec(t.text) ?? /sell (.+?) for/.exec(t.text) ?? /^Build done: buy (?:an? )?(.+?)(?: \(| \.|\.)/.exec(t.text) ?? /^(.+?) (?:next|stacks)/.exec(t.text);
      return m ? m[1] : "";
    }
    const tone = (t) => (t.kind === "skill" ? "blue" : "gold");
    const tip = tipLines.filter((t) => ACT[t.kind] && (t.kind !== "skill" || skillCue)).slice(0, 2).map((t) => `<div class="cue ${tone(t)}" title="${esc(t.text)}">${tipHtml(t)}</div>`).join("");
    if (!p.path.length) { box.innerHTML = `<p class="note">No build for this champion yet.</p>` + tip; return; }
    // One full six-item path (Nico, 2026-11-23): the core, then the 4th/5th/6th picks, as icons labelled with their
    // slot. A real swap (an augment's item, or a counter that passed its test) takes the slot it replaces, with a
    // dashed gold ring; other lit situational items are options under the path. Owned items fade; next is ringed.
    const src = (u) => (u.startsWith("http") ? u : SITE + u);
    const owned = new Set(game.items.map((i) => i % 10000));
    const bootIds = new Set(k?.boots ?? []);
    const hasBoots = [...owned].some((i) => bootIds.has(i));
    const nextId = p.next[0] ? itemId(p.next[0].icon) : -1;
    const seenIds = new Set();
    lastNext = nextId;
    // Dead, shop open: exactly what to buy with your gold toward the next item, icons only. The whole item if your
    // parts make up the rest, else its missing parts, most expensive first.
    const deadShop = (() => {
      if (!game.dead || nextId < 0 || !k?.recipes || !p.next[0]?.icon) return "";
      const base = src(p.next[0].icon).replace(/\d+\.png$/, "");
      const cost = (id) => k.recipes[id]?.[1] ?? 0;
      const rem = (id, pool) => { const j = pool.indexOf(id); if (j >= 0) { pool.splice(j, 1); return 0; }
        return cost(id) - (k.recipes[id]?.[2] ?? []).reduce((s, c) => s + cost(c) - rem(c, pool), 0); };
      const buy = (id, pool, gold, out) => {
        const trial = [...pool], need = rem(id, trial);
        if (need <= gold) { pool.splice(0, pool.length, ...trial); if (need > 0) out.push(id); return gold - need; }
        for (const c of [...(k.recipes[id]?.[2] ?? [])].sort((a, b) => cost(b) - cost(a))) gold = buy(c, pool, gold, out);
        return gold;
      };
      const out = [], left = buy(nextId, game.items.map((i) => i % 10000), game.gold ?? 0, out);
      if (!out.length) return "";
      const pic = (i) => { const fin = cost(i) >= 2000; return `<img src="${base}${fin ? 220000 + i : i}.png" data-alt="${base}${fin ? i : 220000 + i}.png" alt="" data-drop>`; };
      return `<div class="deadshop" title="Dead: buy now (${esc(out.map((i) => k.recipes[i]?.[0] ?? i).join(", "))}), ${Math.round(left)} gold left">${out.map(pic).join("")}</div>`;
    })();
    const shown = p.path.map((it, i) => {
      const sw = p.swaps.find((x) => x.replaces && itemId(x.replaces.icon) === itemId(it.icon));
      // The hover: the engine's tested "why it's best" line (Nico approved 2026-11-23) when there is one, else the slot reason.
      const r = p.reasons?.[i];
      return sw ? { it: { ...sw.item, icon: sw.item.icon ?? it.icon }, why: `${sw.why}\nInstead of ${it.name}`, sw: true, does: false }
        : { it, why: r?.text ?? p.why[i] ?? "", sw: false, does: r?.kind === "does" };
    }).map((x, i) => ({ ...x, core: i < p.coreLen })).filter(({ it }) => { const k = itemId(it.icon ?? "") % 10000; if (seenIds.has(k)) return false; seenIds.add(k); return true; });
    const state = (it) => {
      const id = itemId(it.icon);
      return owned.has(id) || (hasBoots && bootIds.has(id)) ? " own" : id === nextId ? " nx" : "";
    };
    // Share of the item's cost already in your inventory as its parts (the parts' parts count too).
    const partsOwned = (id) => {
      const rec = k?.recipes ?? {}, total = rec[id]?.[1];
      if (!total) return 0;
      const left = [...game.items.map((i) => i % 10000)];
      const have = (pid) => { const j = left.indexOf(pid); if (j >= 0) { left.splice(j, 1); return rec[pid]?.[1] ?? 0; } return (rec[pid]?.[2] ?? []).reduce((t, c) => t + have(c), 0); };
      return Math.min(1, (rec[id][2] ?? []).reduce((t, c) => t + have(c), 0) / total);
    };
    const ord = (n) => `${n}${n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"}`;
    let n = 0;
    // The core sits in one grey dashed box (Nico 2026-11-24, as the site card); the item being built reads "Building".
    const tile = ({ it, why, sw, does }) => {
      const boot = bootIds.has(itemId(it.icon));
      const lbl = boot ? "Boots" : ord(++n);
      const st = state(it);
      // The item being built, in place (Nico 2026-11-24, as PC 1.26.9): arrow, gold ring, a bar for the parts you own.
      const nx = st === " nx";
      const bar = nx ? `<i class="pbar"><b data-style="width:${Math.round(partsOwned(itemId(it.icon ?? "")) * 100)}%"></b></i>` : "";
      return `<div class="slot${st}${sw ? " sw" : ""}" title="${esc([`${nx ? "Building: " : ""}${it.name} · ${why}`, does ? "" : whatItDoes("items", itemId(it.icon ?? ""))].filter(Boolean).join("\n"))}">${nx ? ico("down", "arr") : ""}<img src="${src(it.icon ?? "")}" alt="" data-drop>${bar}<span>${lbl}</span></div>`;
    };
    const coreT = shown.filter((x) => x.core).map(tile).join(""), restT = shown.filter((x) => !x.core).map(tile).join("");
    const tiles = `${coreT ? `<div class="corebox"><span class="lbl">Core</span>${coreT}</div>` : ""}${restT}`;
    // Swaps already sit in the path (dashed ring, reason on hover). Other options: icons only, reason on hover.
    const tipImg = (it, why) => (it?.icon ? `<img class="ii" src="${src(it.icon)}" alt="" title="${esc(`${it.name}: ${String(why ?? "").replace(/\.$/, "")}`)}" data-drop>` : "");
    // Extras: never an item already in the path, nor one that only replaces something you own (no item twice on screen).
    const inPath = new Set(shown.map((x) => itemId(x.it.icon ?? "") % 10000));
    const ownedNames = new Set((k?.recipes ? game.items.map((i) => k.recipes[i % 10000]?.[0]) : []).filter(Boolean));
    const opts = p.pointers.filter((x) => x.item?.icon && !inPath.has(itemId(x.item.icon) % 10000) && !(x.replaces?.name && ownedNames.has(x.replaces.name)))
      .map((x) => tipImg(x.item, `${x.why ?? ""}${x.replaces?.name ? ` (instead of ${x.replaces.name})` : ""}`)).join("");
    // Breakpoints (engine 1.4.0+): a stat threshold you've just passed, as an icon, an arrow and the stat.
    const bpIcon = (b) => b.kind === "augment" ? augIco(b.id) : itemImg(b.id);
    const bps = (p.breakpoints ?? []).filter((b) => b.passed).slice(0, 2).map((b) => `<div class="cue green" title="${esc(`${b.why} (estimated, simulator math)`)}">${bpIcon(b)} ${ico("up")} ${b.stat === "mr" ? "MR" : b.stat === "hp" ? "HP" : "Armor"}</div>`).join("");
    const lines = [
      p.switched ? `<div class="cue gold"${p.switched.because ? ` title="For ${esc(p.switched.because)}"` : ""}>${ico("swap")} ${esc(p.switched.style)}</div>` : "",
      opts ? `<div class="cue gold">${ico("plus")} ${opts}</div>` : "",
      bps,
      // slotFirst: Weapon of Destiny, King Me and Ornn upgrade the first Legendary in slots 1-6.
      p.slotCue ? `<div class="cue blue" title="${esc(`${p.slotCue.why}${p.slotCue.estimated ? " (estimated pick)" : ""}`)}">${p.slotCue.item.icon ? `<img class="ii" src="${src(p.slotCue.item.icon)}" alt="" data-drop>` : ""} → slot 1</div>` : "",
    ].join("");
    box.innerHTML = `<div class="box${shop ? " now" : ""}">
      ${deadShop}
      <div class="path">${tiles}</div>
      ${lines}
      ${tip}</div>`;
  }

  window.showGame = (g) => {
    const prev = game;
    game = g;
    if (!prev || prev.champ !== g.champ) { calls = []; appCall = null; }
    else if (Array.isArray(prev.items) && Array.isArray(g.items)) {
      const left = [...prev.items];
      for (const i of g.items) { const j = left.indexOf(i); if (j >= 0) left.splice(j, 1); else if (calls.length < 60) calls.push({ t: Math.round(g.t ?? 0), kind: "item", got: i, app: lastNext }); }
    }
    lastGame = { ...g, taken: getTaken(g) };
    lastChamp = g.champ;
    if (!document.getElementById("augs") || prev?.champ !== g.champ) {
      setView(`
        ${hero(g.champ, esc(label(g.champ)), "", "head", true).replace(/<\/div>$/, `<div class="foes" id="foes"></div></div>`)}
        <div class="cols">
        <section><h2>Items</h2><div id="items"></div>
        <h2>Quick build</h2><div id="quick"></div></section>
        <section id="augSec"><h2 id="augHead">Augments</h2>
        <div id="augs"></div></section>
        </div>`);
      renderQuick();
      renderAugments();
    }
    // "Augment pick" lights up for 90 seconds after each augment level, and stays lit only while one is untaken.
    if (!prev || prev.champ !== g.champ) { reached = {}; owed = 0; if (!offer.length) resetTrack(); }
    for (const l of AUGMENT_LEVELS) if (l <= g.level && reached[l] === undefined) { reached[l] = prev ? g.t : 0; if (prev && l > 1) owed++; }
    // Back from the dead: the shop was open, so any owed screen came, even if the reading missed it.
    if (prev?.dead && !g.dead) { if (!sawOffer && !offer.length) owed = 0; sawOffer = false; }
    // Lit while an offer is on screen or a screen is owed; "waiting" while alive (it comes at the next death).
    const waiting = owed > 0 && !offer.length && !g.dead;
    const pickNow = offer.length > 0 || owed > 0;
    const head0 = document.getElementById("head");
    head0.textContent = `In game · ${clock(g.t)} · Level ${g.level}${g.dead ? " · Dead: shop now" : ""}`;
    head0.classList.toggle("now", !!g.dead);
    // The owner's chance to win and surrender call: small, under the build, so the build stays the focus.
    let ff = document.getElementById("ff");
    if (!ff) { ff = document.createElement("div"); ff.id = "ff"; document.querySelector(".cols section")?.append(ff); }
    const l = g.live;
    const ffHtml = l ? `<div class="live-mini"><span>Chance to win <b data-style="color:${color(l.win)}">${pct(l.win)}</b></span>
        <div class="bar"><span data-style="width:${pct(l.win)};background:${color(l.win)}"></span></div></div>
      ${l.surrender ? `<div class="box yes" title="A new game is worth more than this one now.">Surrender: yes</div>` : ""}` : "";
    // Redrawn only when it changes, to keep the window's work small during a game.
    if (ff.lastHtml !== ffHtml) { ff.lastHtml = ffHtml; ff.innerHTML = ffHtml; }
    const head = document.getElementById("augHead");
    head.textContent = waiting ? "Augment at your next death" : pickNow ? "Pick now" : "Augments";
    head.classList.toggle("now", pickNow);
    // Only what the item advice reads: attack speed near its cap and ability haste from 100 (in steps of 10), so a
    // buff that ticks attack speed up and down doesn't redraw the items every two seconds.
    const key = (x) => JSON.stringify([x.champ, x.items, x.dead, x.t < 60, x.t >= 600, x.enemies, x.skills, x.level, x.stats && [x.stats[0] >= 0.995, x.stats[1] >= 4.5, x.stats[2] >= 100 ? Math.floor(x.stats[2] / 10) : 0], x.dead && Math.round((x.gold ?? 0) / 100)]);
    if (setOffer(g.offer)) renderAugments();
    if (!prev || key(prev) !== key(g)) renderItems();
    // Before the first buy, extra gold (the Debonair headliner pays gold per augment pick) can change the start.
    if (!bought(g) && prev && Math.round((prev.gold ?? 0) / 50) !== Math.round((g.gold ?? 0) / 50)) renderQuick();
  };

  // The offer changed (read off the screen the moment it did): re-rank right away instead of at the next update.
  window.showOffer = (ids) => {
    if (setOffer(ids) && game) {
      renderAugments();
      const h = document.getElementById("augHead");
      if (h && offer.length) { h.textContent = "Pick now"; h.classList.add("now"); }
    }
  };

  // The app saw which card you clicked as the offer closed: that's your pick. It re-ranks the rest and re-plans the
  // items around it, with nothing to tap (Nico 2026-11-24: no taps in game).
  window.autoTaken = (id) => {
    if (!game) return;
    const t = getTaken(game);
    if (t.includes(id)) return;
    setTaken(game, [...t, id]);
    renderAugments();
    renderItems();
  };

  // Bought anything yet (Poro-Snax, which ARAM hands out, doesn't count)?
  const bought = (g) => (g.items ?? []).some((i) => i % 10000 !== 2052);

  // The champion's quick build, as on the site's card: skill order and spells (the items are just above, live).
  async function renderQuick() {
    const box = document.getElementById("quick");
    if (!box || !game) return;
    const d = await loadBuilds();
    const c = d?.champions?.find((x) => x.id.toLowerCase() === game.champ.toLowerCase());
    if (!c) { box.innerHTML = `<p class="note">No quick build for this champion yet.</p>`; return; }
    const b = (c.builds ?? []).length > 1 ? { ...c, ...c.builds[0] } : c;
    const src = (u) => (u?.startsWith("http") ? u : SITE + (u ?? ""));
    // The first augment can change the start (Upgrade Stormsurge: Hextech Alternator), as the engine says.
    // With extra gold (Debonair, Upgrade augments) the rest goes on the first item's parts (engine goldFill).
    const k = await loadKinds();
    const st = E.startFor ? E.startFor(b, getTaken(game), bought(game) ? undefined : game.gold, k) : { start: b.start ?? [], augment: null };
    box.innerHTML = `<div class="quick">
      <div class="keys"${b.skillSplit ? ` title="${b.skillSplit.weak ? "Your pick, weaker evidence" : "Your pick, estimated"}"` : ""}>${b.skillSplit ? `<span class="key">${esc(b.skillSplit.first)}</span><span class="why">to ${b.skillSplit.points}, then</span>` : ""}${(b.skills ?? []).map((k, i) => `${i ? `<span class="why">›</span>` : ""}<span class="key">${esc(k)}</span>`).join("")}</div>
      ${(b.spells ?? []).map((sp) => `<span class="spell" title="${esc(sp.name)}"><img src="${src(sp.icon)}" alt=""></span>`).join("")}
      ${st.start.length ? `<span class="spell"${st.filled ? ` title="You have extra gold: spend it on these parts"` : st.augment ? ` title="Changed by your first augment"` : st.rich ? ` title="You have extra gold to start"` : ""}>Start ${st.start.map((it) => `<img src="${src(it.icon)}" alt="" title="${esc(it.name)}">`).join("")}</span>` : ""}
    </div>`;
  }

  // The app's page rules block inline handlers (onclick=, onerror=), so these listen on the document instead.
  document.addEventListener("click", (e) => {
    if (e.target.closest?.(".hero .fs")) fullScreen();
    const pt = e.target.closest?.(".chip.pt");
    if (pt) {
      onlyPatch = pt.dataset.o === "1";
      try { localStorage.setItem("patchOnly", onlyPatch ? "1" : "0"); } catch {}
      document.querySelectorAll(".chip.pt").forEach((x) => x.classList.toggle("on", (x.dataset.o === "1") === onlyPatch));
      renderAugments();
      renderItems();
      return;
    }
    const own = e.target.closest?.(".chip.own");
    if (own) {
      ownedOnly = !ownedOnly;
      try { localStorage.setItem("ownedOnly", ownedOnly ? "1" : "0"); } catch {}
      if (lastPick) window.showPick(lastPick);
      return;
    }
    const br = e.target.closest?.(".chip.br");
    if (br) {
      bracket = br.dataset.b;
      try { localStorage.setItem("bracket", bracket); } catch {}
      if (lastPick) window.showPick(lastPick);
    }
    const l = e.target.closest?.(".chip.lucky");
    if (l) {
      lucky = !lucky;
      l.classList.toggle("on", lucky);
      try { localStorage.setItem("lucky", lucky ? "1" : "0"); } catch {}
      renderAugments();
      renderItems();
    }
  });
  // The page rules also drop style="" attributes (Tauri's nonce turns off 'unsafe-inline'), which left the bars
  // empty: widths and colors ride in data-style and are set from script, which the rules allow.
  const restyle = (el) => { el.style.cssText = el.dataset.style; el.removeAttribute("data-style"); };
  new MutationObserver((list) => { for (const m of list) for (const n of m.addedNodes) if (n.nodeType === 1) {
    if (n.dataset.style !== undefined) restyle(n);
    n.querySelectorAll("[data-style]").forEach(restyle);
  } })
    .observe(document.body, { childList: true, subtree: true });
  // a picture that fails tries its data-alt once (finished items: Mayhem art id vs plain id), then goes
  document.addEventListener("error", (e) => { const im = e.target; if (!im.matches?.("img[data-drop]")) return; if (im.dataset.alt) { const a = im.dataset.alt; im.dataset.alt = ""; im.src = a; } else im.remove(); }, true);
  // Esc leaves full screen, F11 flips it.
  addEventListener("keydown", (e) => {
    if ((e.key === "Escape" || e.key === "F11") && window.__TAURI_INTERNALS__) {
      e.preventDefault();
      fullScreen(e.key === "F11" ? !isFull : false);
    }
  });

  window.showOver = () => {
    game = null;
    resetTrack();
    offer = [];
    closedAt = null;
    owed = 0;
    setView(`${hero(lastChamp, "Game over", "The review shows after games of 5 minutes or more")}`);
  };

  // The game's result from the League client's end-of-game screen, when the game's own feed closed before saying it.
  window.setResult = (result) => {
    const t = document.querySelector(".hero .title");
    if (!t || game || !/^(Game over)$/.test(t.textContent)) return;
    t.innerHTML = result === "Win" ? `<span class="ink">Victory</span>` : result === "Lose" ? "Defeat" : t.innerHTML;
    // The result often lands after the review is up: the invitation waits for it.
    if (result === "Win" && document.getElementById("invite")) inviteToShare();
  };

  window.showReview = ({ points, turns, ffFrom, result }) => {
    game = null;
    const verdict = result === "Win" ? "Victory" : result === "Lose" ? "Defeat" : "Game over";
    const turnRows = turns.map((t) => `
      <div class="box"><span class="${t.after >= t.before ? "up" : "down"}">${t.after >= t.before ? "▲" : "▼"}</span> ${clock(t.from)}–${clock(t.to)}: ${pct(t.before)} → <b data-style="color:${color(t.after)}">${pct(t.after)}</b>
        <span class="why">${t.kills >= 0 ? "+" : "−"}${Math.abs(t.kills)} kills${t.towers ? `, ${t.towers > 0 ? "+" : "−"}${Math.abs(t.towers)} towers` : ""}</span></div>`).join("");
    // The surrender call: the chance stayed under the line for a full minute (Nico approved the full-minute hold,
    // 2026-11-23).
    const ff = ffFrom != null
      ? `<div class="box yes" title="The chance stayed under the line for a full minute from then.">Surrender from ${clock(ffFrom)}</div>`
      : `<div class="box">${ico("check")} Never worth it</div>`;
    setView(`
      ${hero(lastChamp, `<span class="${result === "Win" ? "ink" : ""}">${verdict}</span>`, "Game review")}
      <div id="changed"></div>
      <h2 title="Predicted, not measured: an estimate from kills, towers, levels and team strength.">Chance to win</h2>
      ${chart(points, ffFrom)}
      ${turnRows ? `<h2>Turning points</h2>${turnRows}` : ""}
      <h2>Surrender</h2>${ff}
      <div id="recap"></div><div id="invite"></div>`);
    reviewPoints = points ?? [];
    renderRecap();
    if (result === "Win") inviteToShare();
  };

  // After a won game, now and then: a dismissible invitation to share match data (game data only, never names or
  // accounts). Never in game; at most once every two weeks, three times in all, and never again after "Don't ask".
  async function inviteToShare() {
    const box = document.getElementById("invite");
    if (!box || !window.__TAURI_INTERNALS__) return;
    const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
    let st = { n: 0, at: 0, never: false };
    try { st = { ...st, ...JSON.parse(localStorage.getItem("shareInvite") ?? "{}") }; } catch {}
    if (st.never || st.n >= 3 || Date.now() - st.at < 14 * 864e5) return;
    if (await invoke("share_status").catch(() => true)) return;
    const save = (x) => { try { localStorage.setItem("shareInvite", JSON.stringify({ ...st, ...x })); } catch {} };
    save({ n: st.n + 1, at: Date.now() });
    box.innerHTML = `<div class="box invite"><b>Nice win.</b> Want to help DeepARAM's builds get sharper? Share your Mayhem games: champions, items, augments and the result only, never your name or account. You can turn it off any time from the tray, which removes what was sent.
      <div class="filters" data-style="margin:10px 0 0"><button class="chip on" data-share="yes">Share my games</button><button class="chip" data-share="later">Not now</button><button class="chip" data-share="never">Don't ask again</button></div></div>`;
    box.querySelectorAll("[data-share]").forEach((b) => b.addEventListener("click", () => {
      const v = b.dataset.share;
      if (v === "yes") invoke("share_choice", { enabled: true }).catch(() => {});
      if (v === "never") save({ never: true });
      box.innerHTML = v === "yes" ? `<div class="box">Thanks! Sharing is on. The tray's "Share match data" turns it off.</div>` : "";
    }));
  }

  // Chance to win at time t, read off the review's chart points ([seconds, chance]).
  const chanceAt = (pts, t) => {
    if (!pts.length) return null;
    if (t <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) if (pts[i][0] >= t) { const [a, p] = pts[i - 1], [b, q] = pts[i]; return p + (q - p) * (t - a) / Math.max(1, b - a); }
    return pts[pts.length - 1][1];
  };
  // What changed the game: the 2-3 buys or picks followed by the biggest swing in the chance to win over the next
  // 3 minutes, each beside what the app called then, and how many of the app's calls you followed. Post-game only.
  // A lead, not proof: kills, towers and levels move the chance too.
  function whatChanged(k, p, itemPic) {
    const pts = reviewPoints, end = pts.length ? pts[pts.length - 1][0] : 0;
    const finished = (i) => { const r = k?.recipes[i % 10000]; return !!r && ((r[1] ?? 0) >= 2000 || (r[2] ?? []).includes(1001)); };
    const mine = calls.filter((c) => c.kind === "aug" || finished(c.got));
    const rows = mine.map((c) => {
      const to = Math.min(end, c.t + 180);
      if (to - c.t < 60) return null;
      const a = chanceAt(pts, c.t), b = chanceAt(pts, to);
      return a == null || b == null ? null : { ...c, a, b, d: b - a };
    }).filter(Boolean).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 3).filter((r) => Math.abs(r.d) >= 0.03);
    const nameOf = (r, id) => r.kind === "aug" ? (p?.augments?.[id]?.[0] ?? `#${id}`) : (k?.recipes[id % 10000]?.[0] ?? `#${id}`);
    const pic = (r, id) => r.kind === "aug" ? augIcon(id) : itemPic(id);
    const known = (r) => r.app != null && r.app >= 0;
    const row = (r) => {
      const same = known(r) && r.app % 10000 === r.got % 10000;
      const tip = `${clock(r.t)}: ${r.kind === "aug" ? "took" : "finished"} ${nameOf(r, r.got)}. ${!known(r) ? "The app's call wasn't read." : same ? "The app called the same." : `The app called ${nameOf(r, r.app)}.`} Chance to win ${pct(r.a)} → ${pct(r.b)} over the next 3 minutes (estimated; kills, towers and levels move it too).`;
      return `<div class="box chg" title="${esc(tip)}"><span class="why">${clock(r.t)}</span> ${pic(r, r.got)}${!known(r) ? "" : same ? ` <span class="ok">✓</span>` : ` <span class="why">App</span> ${pic(r, r.app)}`} <span class="d ${r.d >= 0 ? "up" : "down"}">${r.d >= 0 ? "+" : "−"}${Math.round(Math.abs(r.d) * 100)}%</span></div>`;
    };
    const held = (kind) => { const xs = mine.filter((c) => c.kind === kind && known(c)); return xs.length ? `${xs.filter((c) => c.app % 10000 === c.got % 10000).length}/${xs.length}` : ""; };
    const acc = [["aug", "Augments"], ["item", "Items"]].map(([kd, l]) => held(kd) ? `<span title="${l}: the app's calls you followed this game">${l} <b>${held(kd)}</b></span>` : "").filter(Boolean).join(" · ");
    return (rows.length ? `<h2 title="The buys and picks followed by the biggest swings in your chance to win (estimated)">What changed the game</h2>${rows.map(row).join("")}` : "")
      + (acc ? `<div class="box why" title="How many of the app's calls you followed this game">Followed the app: ${acc}</div>` : "");
  }

  // What you built and took this game, and what the enemy hit you with: kept off the in-game screen, shown here.
  async function renderRecap() {
    const box = document.getElementById("recap");
    const g = lastGame;
    if (!box || !g) return;
    const [d, k, p] = await Promise.all([loadBuilds(), loadKinds(), loadPicks()]);
    const champ = d?.champions?.find((c) => c.id.toLowerCase() === g.champ.toLowerCase());
    const prefix = (champ?.items?.[0]?.icon ?? "").replace(/\d+\.png$/, "");
    const src = (u) => (u.startsWith("http") ? u : SITE + u);
    const items = g.items.filter((i) => (k?.recipes[i % 10000]?.[1] ?? 0) >= 1000);
    const itemRow = prefix && items.length
      ? `<div class="tiles">${items.map((i) => `<div class="tile"><img src="${src(prefix + (i < 10000 ? 220000 + i : i) + ".png")}" alt="" data-drop>${esc(k?.recipes[i % 10000]?.[0] ?? `#${i}`)}</div>`).join("")}</div>`
      : "";
    const augs = g.taken.length
      ? `<div class="tiles">${g.taken.map((id) => `<div class="tile aug" data-r="${p?.augments?.[id]?.[1] ?? ""}">${augIcon(id)}${esc(p?.augments?.[id]?.[0] ?? `#${id}`)}</div>`).join("")}</div>`
      : "";
    const magic = k ? enemyMagic(k, g.enemies ?? []) : null;
    const dmg = magic === null ? "" : `<div class="why">${esc(damageLine(k, g))}</div><div class="mates" data-style="margin-top:6px">${(g.enemies ?? []).filter((e) => e.champ).map((e) => icon(e.champ)).join("")}</div>${splitBar(magic)}`;
    const ch = document.getElementById("changed");
    if (ch) ch.innerHTML = whatChanged(k, p, (i) => prefix ? `<img src="${src(prefix + (i < 10000 ? 220000 + i : i) + ".png")}" data-alt="${src(prefix + (i % 10000) + ".png")}" alt="" data-drop>` : "");
    if (!itemRow && !augs && !dmg) return;
    box.innerHTML = `<h2>Your build</h2>
      ${augs ? `<div class="box"><div class="why">Augments you took</div>${augs}</div>` : ""}
      ${itemRow ? `<div class="box"><div class="why">Items at the end</div>${itemRow}</div>` : ""}
      ${dmg ? `<div class="box">${dmg}</div>` : ""}`;
  }
</script>
