<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepARAM</title>
<style>
  /* The companion window (src-tauri/src/companion.rs): a normal window for a second screen, in the site's dark look. */
  :root { color-scheme: dark; --bg: #090b0f; --surface: #11151c; --raised: #181d26; --fg: #e8ecf2; --muted: #8b94a3;
    --line: #222936; --accent: #5cc0ff; --good: #4cc98b; --bad: #f0776f; --gold: #e0b45c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.4 "Mona Sans", "Segoe UI Variable", "Segoe UI", Cantarell, "Noto Sans", system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 16px 0 8px; }
  .row { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 6px; }
  .row.best { border-color: var(--accent); }
  .row img, .mates img { width: 36px; height: 36px; border-radius: 8px; background: var(--raised); }
  .name { font-weight: 600; }
  .why { color: var(--muted); font-size: 12px; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
  .mates { display: flex; gap: 6px; }
  .mates img { width: 28px; height: 28px; }
  .big { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .bar { height: 14px; border-radius: 7px; background: var(--raised); overflow: hidden; margin: 12px 0; }
  .bar span { display: block; height: 100%; transition: width .6s; }
  .box { padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-top: 10px; }
  .box.yes { border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
  svg { width: 100%; height: 140px; display: block; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="view"><h1>DeepARAM</h1><p class="note">Opens by itself in Mayhem champion select and after each game.</p></main>
<script>
  // The app calls showPick({allies, mine, bench}) in champion select (champion ids), showLive({...}) during a game
  // (the site owner only) and showReview({points, turns, ffFrom, result}) after it.
  const SITE = "https://deeparam.com";
  const view = document.getElementById("view");
  const pct = (p) => `${Math.round(p * 100)}%`;
  const pts = (n) => (Math.abs(n) < 0.0005 ? "0.0" : `${n > 0 ? "+" : "−"}${Math.abs(n * 100).toFixed(1)}`);
  const clock = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
  const color = (p) => (p >= 0.6 ? "var(--good)" : p >= 0.4 ? "var(--gold)" : "var(--bad)");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const icon = (alias) => `<img src="${SITE}/icons/champions/${encodeURIComponent(alias)}.webp" alt="">`;
  const label = (alias) => alias.replace(/([a-z])([A-Z])/g, "$1 $2");

  // Same scoring as the site's Best pick (web/src/lib/team-fit-score.ts).
  let fit = null;
  const loadFit = () => fit ?? (fit = fetch(`${SITE}/data/team-fit.json`).then((r) => r.json()).catch(() => null));
  function pairBoost(d, a, b) {
    const exact = d.pairs[[a, b].sort().join(" ")];
    if (exact !== undefined) return exact;
    let sum = 0, n = 0;
    for (const x of d.champions[a]?.[1] ?? []) for (const y of d.champions[b]?.[1] ?? []) {
      const v = d.archetypes[[x, y].sort().join("+")];
      if (v !== undefined) { sum += v; n += 1; }
    }
    return n ? sum / n : 0;
  }
  function rank(d, allies, options) {
    const team = allies.filter((a) => d.champions[a]);
    const others = Object.keys(d.champions).filter((id) => !team.includes(id));
    const avg = new Map(team.map((a) => [a, others.reduce((s, id) => s + pairBoost(d, id, a), 0) / (others.length || 1)]));
    return options.filter((id) => d.champions[id]).map((id) => {
      const parts = team.map((ally) => ({ ally, boost: pairBoost(d, id, ally) - avg.get(ally) }));
      const fitSum = parts.reduce((s, p) => s + p.boost, 0);
      const strength = d.champions[id][0] - 0.5;
      return { id, strength, fit: fitSum, score: strength + fitSum, parts };
    }).sort((a, b) => b.score - a.score);
  }
  function reason(p) {
    const best = [...p.parts].sort((a, b) => b.boost - a.boost)[0];
    const worst = [...p.parts].sort((a, b) => a.boost - b.boost)[0];
    if (p.fit >= 0.003 && best?.boost >= 0.005) return `Pairs well with ${label(best.ally)}`;
    if (p.fit <= -0.003 && worst?.boost <= -0.005) return `Clashes with ${label(worst.ally)}`;
    return p.strength >= 0.01 ? "Strong this patch" : "";
  }

  window.showPick = async ({ allies, mine, bench }) => {
    const d = await loadFit();
    if (!d) { view.innerHTML = `<h1>Champion select</h1><p class="note">Couldn't load the picks. Check your connection.</p>`; return; }
    const byId = Object.fromEntries(Object.entries(d.ids ?? {}).map(([a, id]) => [id, a]));
    const team = allies.map((id) => byId[id]).filter(Boolean);
    const options = [mine, ...bench].map((id) => byId[id]).filter(Boolean);
    const ranked = rank(d, team, [...new Set(options)]);
    const rows = ranked.map((p, i) => `
      <div class="row${i === 0 && p.id !== byId[mine] ? " best" : ""}">
        ${icon(p.id)}
        <div><div class="name">${esc(label(p.id))}${p.id === byId[mine] ? " <span class=\"why\">(yours)</span>" : ""}</div><div class="why">${esc(reason(p))}</div></div>
        <div class="num">Strength ${pts(p.strength)}${team.length ? `<br>Team fit ${pts(p.fit)}` : ""}</div>
      </div>`).join("");
    view.innerHTML = `
      <h1>Champion select</h1>
      ${team.length ? `<h2>Your team</h2><div class="mates">${team.map(icon).join("")}</div>` : ""}
      <h2>Your choices, best first</h2>
      ${rows || `<p class="note">Waiting for your champion and bench…</p>`}
      <p class="note">Strength this patch plus how well each pairs with your team, in win-rate points. A guide for ranking picks, not a promise. You make the pick.</p>`;
  };

  function chart(points, from) {
    if (points.length < 2) return "";
    const end = Math.max(points[points.length - 1][0], 60);
    const x = (t) => (t / end) * 500, y = (p) => 130 - p * 120;
    const path = points.map(([t, p], i) => `${i ? "L" : "M"}${x(t).toFixed(1)},${y(p).toFixed(1)}`).join(" ");
    const ff = from != null ? `<line x1="${x(from)}" x2="${x(from)}" y1="10" y2="130" stroke="var(--bad)" stroke-dasharray="3 4"/>` : "";
    return `<svg viewBox="0 0 500 140" role="img" aria-label="Predicted chance to win over the game">
      <line x1="0" x2="500" y1="${y(0.5)}" y2="${y(0.5)}" stroke="var(--line)" stroke-dasharray="4 4"/>${ff}
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>`;
  }

  window.showLive = ({ t, win, ffLine, ffHint, history }) => {
    let ff = `<div class="box">Too early to call a surrender (from minute 8).</div>`;
    if (ffLine != null)
      ff = ffHint
        ? `<div class="box yes">Surrender: yes. Under ${pct(ffLine)} for a full minute, so a new game is worth more.</div>`
        : `<div class="box">Surrender: no. The line at this minute is ${pct(ffLine)}.</div>`;
    view.innerHTML = `
      <h1>Live · ${clock(t)}</h1>
      <div class="big" style="color:${color(win)}">${pct(win)}</div>
      <div class="bar"><span style="width:${pct(win)};background:${color(win)}"></span></div>
      ${ff}${chart(history, null)}
      <p class="note">Predicted from kills, towers, levels and team strength.</p>`;
  };

  window.showReview = ({ points, turns, ffFrom, result }) => {
    const verdict = result === "Win" ? "Victory" : result === "Lose" ? "Defeat" : "Game over";
    const turnRows = turns.map((t) => `
      <div class="box">${clock(t.from)}–${clock(t.to)}: ${pct(t.before)} → <b style="color:${color(t.after)}">${pct(t.after)}</b>
        <div class="why">${t.kills >= 0 ? "+" : "−"}${Math.abs(t.kills)} kills${t.towers ? `, ${t.towers > 0 ? "+" : "−"}${Math.abs(t.towers)} towers` : ""} for your team</div></div>`).join("");
    const ff = ffFrom != null
      ? `<div class="box yes">From ${clock(ffFrom)} a surrender would have saved time: the chance stayed under the line for a full minute.</div>`
      : `<div class="box">A surrender never paid off this game.</div>`;
    view.innerHTML = `
      <h1>Game review · ${verdict}</h1>
      <h2>Chance to win over the game</h2>
      ${chart(points, ffFrom)}
      ${turnRows ? `<h2>Turning points</h2>${turnRows}` : ""}
      <h2>Surrender</h2>${ff}
      <p class="note">Predicted, not measured: an estimate from kills, towers, levels and team strength.</p>`;
  };
</script>
</body>
</html>
