[package]
name = "deeparam"
version = "0.1.0"
description = "DeepARAM desktop app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

# Asks the session bus whether the desktop can show a tray icon.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
