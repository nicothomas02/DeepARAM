[package]
name = "deeparam"
version = "0.2.1"
description = "DeepARAM desktop app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
# The random sharing key (sharing.rs); already in the build through Tauri.
getrandom = "0.3"

# Reads augment offers off the screen (screen copy and Windows' built-in text recognition) and lists running
# programs without starting one. Same version Tauri already uses, so nothing extra to build.
[target.'cfg(windows)'.dependencies]
# Checks a downloaded update against the release's SHA-256 before it runs (already in the build through Tauri).
sha2 = "0.10"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_WinRT",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Asks the session bus whether the desktop can show a tray icon.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
