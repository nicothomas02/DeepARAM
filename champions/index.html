<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mayhem Champions</title>
  <meta name="description" content="Every champion's Mayhem changes, abilities and builds.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="panel" id="list">
      <div class="card">
        <p class="eyebrow" id="patch"></p>
        <h2 class="section" data-t>Champions in Mayhem</h2>
        <p class="muted" style="margin-top:0.5rem" id="list-intro"></p>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Find a champion" autocomplete="off" aria-label="Find a champion" data-t-attr="placeholder,aria-label">
        <div class="filters" id="filters"></div>
      </div>
      <div class="roster" id="roster"></div>
      <p class="muted small" id="empty" hidden data-t>No champion matches.</p>
    </section>

    <section class="panel" id="page" hidden></section>

  </main>
  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
